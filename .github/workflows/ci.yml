name: ci

# Every job here is a gate, and every gate was proven by a planted violation
# before it was wired in. A gate nobody has seen fail is a gate nobody should
# trust.

on:
  pull_request:
  push:
    branches: [main]
  # Four of PRD Q4's twelve constants are read from this workflow -- the unit and
  # PR duration ratchets, the coverage floor, and the conformance matrix's
  # elapsed time. `bench/RUNNER.md` rule 3 invalidates every runner-dependent
  # ratification when the runner class changes, and a repository's visibility
  # changes it silently. Without this trigger the only way to re-read those four
  # is to push a commit, which makes the measurement a side effect of an
  # unrelated change. A ratification gate needs to be re-runnable on demand.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # The constants tables and the error registry live in the handoff pack, which
  # is a separate repository. Both sync gates read them from here.
  ADOPT_IMPL_SPEC_PATH: ${{ github.workspace }}/pack/builds/build_0/03-implementation-spec-build0.md
  ADOPT_CONTRACTS_PATH: ${{ github.workspace }}/pack/builds/build_0/02-contracts-build0.md

jobs:
  lint:
    name: lint (ruff, mypy --strict, twelve import contracts)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: adopt-core
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true
      - name: Sync
        working-directory: adopt-core
        run: uv sync --all-packages
      - name: Ruff
        working-directory: adopt-core
        run: |
          uv run ruff check .
          uv run ruff format --check .
      - name: mypy --strict
        working-directory: adopt-core
        # `bench/` is included because it is real code that opens databases and
        # drives subprocesses. A benchmark harness that is not type-checked is
        # where a measurement quietly starts measuring the wrong thing.
        run: uv run mypy --strict packages/ scripts/ tools/ bench/
      - name: Import contracts
        working-directory: adopt-core
        run: uv run lint-imports --config importlinter.ini

  constants-sync:
    name: constants-sync
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    # The handoff pack is private. Fork and Dependabot pull requests never
    # receive its token, and a fork's own `main` may not configure a pack at
    # all. Skip this trusted-boundary comparison before allocating a runner;
    # every self-contained public gate still runs.
    if: >-
      ${{
        vars.ADOPT_PACK_REPOSITORY != '' &&
        (
          github.event_name == 'push' ||
          (
            github.event_name == 'pull_request' &&
            github.event.pull_request.head.repo.full_name == github.repository &&
            github.event.pull_request.user.login != 'dependabot[bot]'
          )
        )
      }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: adopt-core
      - name: Check out the handoff pack
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ vars.ADOPT_PACK_REPOSITORY }}
          path: pack
          # `GITHUB_TOKEN` is scoped to this repository alone, so a private pack
          # needs its own read-only credential. Without it this job fails at
          # checkout, which reads like an infrastructure flake rather than the
          # missing secret it is.
          token: ${{ secrets.ADOPT_PACK_TOKEN }}
          persist-credentials: false
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
      - working-directory: adopt-core
        run: uv sync --all-packages
      - name: Constants table matches both modules
        working-directory: adopt-core
        run: uv run python scripts/constants_sync.py --check

  error-registry-sync:
    name: error-registry-sync
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    if: >-
      ${{
        vars.ADOPT_PACK_REPOSITORY != '' &&
        (
          github.event_name == 'push' ||
          (
            github.event_name == 'pull_request' &&
            github.event.pull_request.head.repo.full_name == github.repository &&
            github.event.pull_request.user.login != 'dependabot[bot]'
          )
        )
      }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: adopt-core
      - name: Check out the handoff pack
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ vars.ADOPT_PACK_REPOSITORY }}
          path: pack
          token: ${{ secrets.ADOPT_PACK_TOKEN }}
          persist-credentials: false
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
      - working-directory: adopt-core
        run: uv sync --all-packages
      - name: Contracts §13 matches the error module, both directions
        working-directory: adopt-core
        run: uv run python scripts/error_registry_sync.py --check

  licence-gate:
    name: licence-gate
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
      - run: uv sync --all-packages
      - name: Prove the gate still rejects
        run: uv run python scripts/licence_gate.py --self-test
      - name: Check the installed tree
        run: uv run python scripts/licence_gate.py --check

  pricing-freshness:
    name: pricing-freshness (warns; never blocks)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
      - run: uv sync --all-packages
      # AI spec §3: the price table carries `verified_on` and a CI check *warns*
      # past `PRICING_VERIFIED_MAX_AGE_DAYS`. `stale_rows` existed from the day
      # it was written with no caller, so the check the spec requires did not
      # run. This is the caller.
      #
      # The step exits 0 on a stale row on purpose -- a drifted price makes
      # `Cost.usd` an estimate, and a build that refuses because a vendor has not
      # edited a page in ninety-one days is a red gate no code change can fix.
      # Which is exactly why the self-test comes first: a check that cannot fail
      # is a check that can rot, so this proves it still *detects*.
      - name: Prove the check still detects a stale row
        run: uv run python scripts/pricing_freshness.py --self-test
      - name: Report price rows past their re-verification window
        run: uv run python scripts/pricing_freshness.py

  vuln-audit:
    name: vuln-audit (pip-audit over the resolved tree)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
      - run: uv sync --all-packages
      # `licence-verifications.md` records a security status per dependency, and
      # the release gate (`--strict-verify`) rejects `pending-audit`. This is what
      # keeps that status true between releases: dependencies acquire
      # vulnerabilities after we pin them, so an audit that runs once is a
      # statement about a day rather than about the tree.
      #
      # **Run through `uvx`, deliberately.** `pip-audit` in an isolated
      # environment keeps its own ~20 transitive dependencies out of `uv.lock` and
      # therefore out of `licence-verifications.md`. A scanner added as a dev
      # dependency makes every one of its dependencies a verification obligation,
      # which is a poor trade for a tool that only reads a list.
      #
      # Pinned by version for the reason everything else here is: a scanner that
      # changed under us would change this job's verdict without a commit.
      - name: Export the resolved tree
        run: uv export --format requirements-txt --no-hashes --all-groups -o reqs.check.txt
      - name: Audit it
        run: uvx pip-audit@2.9.0 -r reqs.check.txt --progress-spinner off
      # The audit is only worth its status column if the audited set *is* the
      # recorded set. Without this a row could read `clean` having never been
      # looked at -- the same class of hole `escape_coverage.py` exists to close
      # for isolation tests.
      - name: The audited set is the recorded set
        run: uv run python scripts/licence_gate.py --check --strict-verify

  first-party-deps:
    name: first-party-deps (each distribution installs on its own)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
      - run: uv sync --all-packages
      # Two distributions shipped in v0.3.0 importing a first-party module they
      # never declared, and no gate here could see it: every test runs under
      # `uv sync --all-packages`, where all fifteen are present whatever any one
      # of them declares, and `packaged-artifact` installs `adopt-cli`, which
      # supplies the missing name transitively. The workspace is not a consumer.
      # `adopt-plane` was the first thing to install a subset, and it failed at
      # import. See BACKLOG.md B-06.
      - name: Prove the gate still rejects
        run: uv run python scripts/first_party_deps.py --self-test
      - name: Every first-party import is declared by the manifest
        run: uv run python scripts/first_party_deps.py --check

  no-destructive-sql:
    name: no-destructive-sql (the store never loses data)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
      - run: uv sync --all-packages
      # The store has no down-migration and never will: recovery from a bad
      # deploy is older code opening a newer store, which only holds while every
      # store is in a state some version produced. A DROP in shipped code
      # deletes that guarantee for whoever runs it.
      - name: Prove the gate still rejects
        run: uv run python scripts/no_destructive_sql.py --self-test
      - name: No DROP, ALTER ... DROP, TRUNCATE or unpredicated DELETE
        run: uv run python scripts/no_destructive_sql.py

  quarantine-audit:
    name: quarantine-audit (agent-authored code cannot forge a URI)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
      - run: uv sync --all-packages
      # `04` §6 B1-CR-26: the audit reads the scheme from `adopt_const.URI_SCHEME`
      # rather than restating it, and the proof plants a literal composed from
      # that constant. An audit that hard-codes the value it protects goes blind
      # the next time that value is ratified -- which is exactly what happened
      # when Build 0 CR-06 replaced the proposed `adopt://` five days after this
      # pack was written.
      - name: A forged URI is rejected, and a clean module still gets through
        run: uv run python scripts/quarantine_audit.py --self-test

  evals:
    name: evals (the E1-E9 harness, without a provider)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
      - run: uv sync --all-packages
      # **This job proves the harness, not the thresholds.** With no
      # `--eval-adapters` named, the adapter-parameterized cases collect zero
      # items and the session header says E1-E9 did not execute; what runs is the
      # golden-set shape, the scorer calibration and the stub-driven driver. `04`
      # §8's thresholds need a credential, and `05` S1.7's validation lines 2 and
      # 3 stay unchecked until a run that has one.
      - name: Scorers, golden sets and the driver
        run: uv run pytest -q -m evals

  build1-gates:
    name: build1-gates (append_only, idempotence, env_isolation, determinism)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
      - run: uv sync --all-packages
      # **These four gates existed from S1.1 and ran in no CI job until S1.8**
      # (B1-CR-98). `03` §8 lists them as hard-fail gates in order, `00` §11 item
      # 3 makes "CI green including append-only, idempotence,
      # environment-isolation and determinism" a **build** Definition-of-Done
      # condition, and the job above named `append-only` runs import contracts and
      # a grep -- not `pytest -m append_only`. So the four markers were green on
      # whichever developer machine last ran them, and the DoD condition could not
      # have been satisfied by anything in the repository.
      #
      # Run as four steps rather than one selector, because `-m "append_only or
      # idempotence or ..."` reports one failure for four different invariants and
      # the point of separate gates is knowing which one broke.
      - name: append_only -- zero UPDATEs on *_revision, zero DELETEs
        run: uv run pytest -q -m append_only
      - name: idempotence -- an unchanged re-run writes zero revisions
        run: uv run pytest -q -m idempotence
      - name: env_isolation -- a staging run cannot emit a production URI
        run: uv run pytest -q -m env_isolation
      - name: determinism -- identical URI set and source_versions across runs
        run: uv run pytest -q -m determinism

  build1-journeys:
    name: build1-journeys (the six CUJ journeys and the integration suite)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The ratchet step below runs `-m "not bench and not e2e"`, which
          # collects the unit suite, which asserts what `build0_untouched`
          # reports -- so this job needs the baseline for the same reason `unit`
          # and `coverage-floor` do. Three jobs, one selector each, one cause.
          fetch-depth: 0
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
      - run: uv sync --all-packages
      # `03` §7 runs the journeys on main and the integration suite per PR. Both
      # had 368 and 47 collected tests respectively and no job.
      - name: E2E journeys
        run: uv run pytest -q -m e2e
      - name: Integration suite
        run: uv run pytest -q -m integration
      # The PR ratchet's subject, and it is narrower than `-m "not bench"` on
      # purpose: `03` §7's Gate column puts E2E journeys on `main` and integration
      # per-PR. Measured at 720.2s with the journeys in and 519.4s with them out,
      # against a 600s budget -- so the widened selector was the defect rather than
      # the suite, and no test was deleted to reach the number (B1-CR-99).
      - name: The whole suite, ratcheted
        run: |
          uv run python scripts/ci_ratchet.py --budget pr --             uv run pytest -q -m "not bench and not e2e"

  cuj5-network-down:
    name: cuj5-network-down (the interface is administratively down, not merely guarded)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
      - run: uv sync --all-packages
      # `05` S1.8: *"CUJ-5 runs with the network interface administratively down
      # in CI"*, and that is a stronger claim than the socket guard being on. The
      # guard proves **our code** refuses; an interface that is down proves nothing
      # in the process could have reached a network by a path nobody thought of --
      # a library that opens its own socket, a dependency that resolves a name at
      # import, a subprocess. Those are exactly the paths a guard written against
      # known callers does not cover.
      #
      # `unshare -rn` gives an unprivileged network namespace with nothing but a
      # down loopback, which is available on GitHub's Ubuntu runners without root.
      # The whole test process runs inside it.
      # Ubuntu 23.10 onward restricts unprivileged user namespaces through
      # AppArmor, so `unshare -rn` on a 24.04 runner fails with *"write failed
      # /proc/self/uid_map: Operation not permitted"* -- and the command then
      # runs **outside** any namespace, with the runner's full network. The
      # proof step below caught exactly that on this job's first execution and
      # refused, which is what it is for. Lifting the restriction is what makes
      # the namespace available; the proof stays, because the restriction is not
      # the only way the namespace can fail to exist.
      - name: Permit unprivileged user namespaces
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - name: Prove the namespace really has no network
        run: |
          set -euo pipefail
          if unshare -rn python3 -c "
          import socket, sys
          try:
              socket.create_connection(('1.1.1.1', 53), timeout=3)
          except OSError:
              sys.exit(0)
          sys.exit(1)
          "; then
            echo "network namespace confirmed down"
          else
            echo "::error::the namespace reached the network -- this job would pass vacuously"
            exit 1
          fi
      - name: CUJ-5 with the interface down
        run: unshare -rn uv run pytest -q tests/e2e/test_map_cuj5.py

  packaged-artifact:
    name: packaged-artifact (install what we ship, then use it)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true
      - run: uv sync --all-packages
      # **The whole suite runs against an editable install**, where a
      # `parents[N]` walk from `__file__` still lands in the checkout. So a wheel
      # that shipped without `schema/` passed 741 tests, `--check` on every gate,
      # and a `version --json` smoke test, and was caught only when a packed
      # binary made it fatal at import (CR-53). Nothing here had ever installed a
      # built artefact and used it -- the gap was the subject, not the
      # assertions.
      #
      # It lives outside the pytest jobs deliberately: it builds wheels and
      # creates a venv, and putting that inside the suite would spend the
      # `CI_UNIT_MAX_MINUTES` ratchet on a subprocess that is not a unit test.
      - name: Prove the gate still fails on a stripped artefact
        run: uv run python scripts/packaged_artifact.py --self-test
      - name: The installed artefact carries its own data
        run: uv run python scripts/packaged_artifact.py --check

  artifact-licence:
    name: artifact-licence (the licence ships inside what we publish)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true
      - run: uv sync --all-packages
      # Fifteen Apache-2.0 distributions were one dispatch from PyPI carrying no
      # licence at all: no `License-Expression`, no `License-File`, and neither
      # the Apache text nor the NOTICE inside the wheel or the sdist. Fifteen
      # PyPI pages would have read "License: UNKNOWN".
      #
      # `licence-gate` above holds 32 **third-party** distributions to seven
      # audited fields each and never looked at ours -- the same
      # wrong-subject failure `packaged-artifact` exists for (CR-53), which is
      # why this is its own gate rather than a step in that one.
      - name: Prove the gate still fails on a stripped manifest
        run: uv run python -m scripts.artifact_licence --self-test
      - name: Every artefact carries the licence it is published under
        run: uv run python -m scripts.artifact_licence --check

  unit:
    name: unit (ratcheted to CI_UNIT_MAX_MINUTES)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # `build0_untouched` resolves its baseline against `main`, and the unit
          # suite asserts what that gate reports. A default checkout fetches one
          # ref at depth 1, so `main` is not a valid object name and the gate
          # reports that it cannot list packages -- true, useless, and red.
          fetch-depth: 0
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
      - run: uv sync --all-packages
      # The ratchet is a hard failure: a green suite over budget still fails.
      # Adding runtime requires removing equivalent runtime in the same change.
      - name: Unit suite
        run: uv run python scripts/ci_ratchet.py --budget unit -- uv run pytest -m unit

  property:
    name: property
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
      - run: uv sync --all-packages
      # Seeded so a failure is reproducible from the log alone. The nightly
      # run uses a fresh seed to keep exploring the space.
      - name: Property suite
        run: uv run pytest -m property --hypothesis-seed=0

  durability:
    name: durability (kill and resume, in-process backend)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
      - run: uv sync --all-packages
      # Implementation spec §6 budgets this suite at two minutes and runs it on
      # every PR. It spawns a child process, kills it mid-step and asserts the
      # resume -- so it is the one job here that tests what happens when the
      # process does not survive.
      #
      # The DBOS half of the same suite runs in `adopt-plane`, which has the
      # Postgres service and the closed backend. One suite, two backends, two
      # repositories: `core-independent` forbids this one from importing
      # `plane_workflow` at all.
      - name: Kill-and-resume drill
        run: uv run pytest tests/durability --backend=inproc -v
      # A drill that silently collected nothing would report the durability
      # guarantee green without ever killing a process.
      - name: Prove the drill actually ran
        run: |
          set -euo pipefail
          # `--collect-only` with **no explicit `-q`**: `pyproject.toml`'s addopts
          # already passes one, and a second switches pytest to a compact
          # per-FILE summary (`path: 3`) instead of one node id per line. The
          # first version of this step counted that single line and reported
          # "collected 1" for a suite of three -- the check was counting files.
          count=$(uv run pytest tests/durability --backend=inproc --collect-only                   | grep -c "::test_")
          if [ "$count" -lt 3 ]; then
            echo "::error::the durability suite collected $count tests; expected at least 3"
            exit 1
          fi
          echo "durability suite collected $count tests"

  conformance-matrix:
    name: conformance-matrix (>= 2 non-test adapters green)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    # PRD N12 and D5, AI spec §7.1's gate. **A pipeline exercising one vendor is a
    # failing pipeline** -- below two real adapters the BYO-model argument is
    # decorative and the seam is a vendor wrapper with extra steps.
    #
    # The rule itself lives in `scripts/conformance_matrix.py`, not in this file.
    # A gate written as shell here is a gate nobody writes a negative test for, and
    # this one has ways to be wrong that all look green: counting a red adapter as
    # green, counting the recorded fake toward the arity, and never noticing that
    # only one adapter ran. `--self-test` drives each.
    #
    # **The "at least one local" half is deferred to backlog (CR-48).** The local
    # model server, its digest pin and the run-time model pull all went with it --
    # see `BACKLOG.md` for what that gives up and what brings it back.
    #
    # **The job runs only once someone names the adapters to prove it against.**
    # `ADOPT_CONFORMANCE_ADAPTERS` unset means no credential has been provisioned,
    # and a job that failed in that state would be permanently red for a reason no
    # code change can fix -- which is how a gate gets deleted. Its absence is
    # visible instead: `test_ci_gates.py` asserts the job is still declared, and
    # `05`'s Definition of Done condition 4 stays open until it has run green.
    if: >-
      ${{
        vars.ADOPT_CONFORMANCE_ADAPTERS != '' &&
        (
          github.event_name == 'push' ||
          (
            github.event_name == 'pull_request' &&
            github.event.pull_request.head.repo.full_name == github.repository &&
            github.event.pull_request.user.login != 'dependabot[bot]'
          )
        )
      }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
      - run: uv sync --all-packages
      - name: Prove the two-adapter rule still rejects
        run: uv run python scripts/conformance_matrix.py --self-test
      # A CONFIGURATION check, not a liveness check, and the distinction matters
      # so nobody reads a green preflight as "the credential works". `agent check`
      # deliberately opens no socket -- it must be usable before any credential
      # exists, which is when an operator is configuring them -- so it answers
      # "is this adapter registered, permitted and given a model", and nothing
      # about whether the provider will accept the request.
      #
      # It earned its place immediately: its first run reported
      # AGENT_OFFLINE_ADAPTER_DENIED for both adapters, because offline is the
      # default (contracts §1.7) and this step had not passed `--allow-network`.
      # Diagnosing a bad key or a rejected parameter is `_wire.py`'s job, via the
      # allowlisted `error.type/code/param` identifiers (CR-52).
      #
      # `continue-on-error`, deliberately: a DIAGNOSTIC, not a gate. The matrix
      # below is the gate, and a preflight that could fail the job would be a
      # second opinion about adapter health with its own way of being wrong.
      - name: Preflight -- is each adapter configured and permitted?
        continue-on-error: true
        env:
          ADOPT_ADAPTER_ENDPOINT: ${{ vars.ADOPT_ADAPTER_ENDPOINT }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          for pair in $(echo "${{ vars.ADOPT_CONFORMANCE_ADAPTERS }}" | tr ',' ' '); do
            adapter="${pair%%=*}"
            model="${pair#*=}"
            echo "--- $adapter ($model) ---"
            # `--allow-network` is the root flag, so it precedes the subcommand.
            # Without it every check is refused with AGENT_OFFLINE_ADAPTER_DENIED
            # before a socket opens -- offline is the default (contracts §1.7),
            # and that is the posture rather than a misconfiguration.
            ADOPT_MODEL="$model" uv run adopt --allow-network agent check --adapter "$adapter" || true
          done

      # `ADOPT_CONFORMANCE_ADAPTERS` carries a model per adapter --
      # `openai=gpt-5,anthropic=claude-sonnet-4-5`. It has to: no adapter has a
      # default model (AI spec §2), and one process-wide `ADOPT_MODEL` across two
      # hosted vendors names a model at one and a stranger at the other, so the
      # gate could not have gone green however many credentials were provisioned.
      # `ADOPT_CONFORMANCE_MODEL` remains the fallback for a bare adapter id.
      - name: The matrix
        env:
          ADOPT_MODEL: ${{ vars.ADOPT_CONFORMANCE_MODEL }}
          ADOPT_ADAPTER_ENDPOINT: ${{ vars.ADOPT_ADAPTER_ENDPOINT }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          uv run python scripts/conformance_matrix.py             --adapters=${{ vars.ADOPT_CONFORMANCE_ADAPTERS }}
      # D5's inputs. Uploaded even on failure: "which adapters were green" is
      # exactly the question a red matrix leaves open.
      - name: Adapter verdicts for the metrics job
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: metrics-conformance
          path: ci-metrics.jsonl
          if-no-files-found: ignore

  golden-g0:
    name: golden-g0 (export -> import -> export is byte-identical)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    # **No soft-fail, no continue-on-error, ever.** G0 is the executable form of
    # the commercial promise -- stop paying and you keep the knowledge -- and
    # that promise has no degraded mode either. PRD D1 measures this job's pass
    # rate at 1.0 over the trailing 30 CI days, which is a ratio a soft-failing
    # job would silently satisfy while proving nothing.
    #
    # It is a job of its own rather than a step in `unit` because the three
    # assertions are the build's definition of done, condition 2: a reviewer
    # looking at a pull request should see whether portability holds without
    # opening a log.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
      - run: uv sync --all-packages
      - name: The three G0 assertions over a fixture covering every exportable table
        run: uv run pytest tests/golden -m golden
      # The round trip through the CLI, exactly as `05` S5 states it and exactly
      # as a client would run it. Asserted here as well as in `tests/golden`
      # because the library round trip would pass with the commands wired to the
      # wrong store, and the commands are what §14 makes a contract.
      - name: The documented command sequence, run literally
        run: |
          set -euo pipefail
          uv run python scripts/s5_validation_walkthrough.py --store /tmp/g0.db
          export ADOPT_STORE_PATH=/tmp/g0.db
          uv run adopt export /tmp/b1 --json
          uv run adopt import /tmp/b1 --into /tmp/s2.db --json
          uv run adopt export /tmp/b2 --store /tmp/s2.db --json
          diff -r /tmp/b1/tables /tmp/b2/tables
          echo "tables/ are byte-identical"
      - name: No runtime-annex table reaches the bundle
        run: |
          set -euo pipefail
          count="$(grep -c "runtime" /tmp/b1/manifest.json || true)"
          echo "occurrences of 'runtime' in manifest.json: ${count}"
          test "${count}" = "0"

  coverage-floor:
    name: coverage-floor (an alarm, never a target)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Same reason as `unit`: this job runs the whole unit suite to compute
          # the figure, so it inherits `build0_untouched`'s baseline lookup.
          fetch-depth: 0
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
      - run: uv sync --all-packages
      # `COVERAGE_FLOOR_CORE` reached S9 with no consumer anywhere in either
      # tree -- the one §2.3 constant that measured nothing. Implementation spec
      # §6 names six packages it alarms on, and this is the alarm.
      #
      # It fails BELOW the floor and does nothing at all above it. There is no
      # ratchet and no "must not decrease" rule: §2.3 says "never a target" and
      # §6 bans coverage as a target outright, and a floor that rewards a rise is
      # a target with better manners -- which is what manufactures assertion-free
      # tests. `adopt-cli` sits under the floor deliberately and is not judged;
      # `05`'s summary table budgets zero dedicated tests there.
      - name: Prove the alarm still fires
        run: uv run python scripts/coverage_floor.py --self-test
      - name: The floor
        run: uv run python scripts/coverage_floor.py --check

  append-only:
    name: append-only (no UPDATE on a revision, no covered_cache write outside adopt_coverage)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
      - run: uv sync --all-packages
      # The `lint` job runs all twelve contracts; this job exists to run the two
      # that guard an invariant with no other enforcement, and to prove one of
      # them still rejects. A gate nobody has seen fail is a gate nobody should
      # trust, and these two are the ones a well-meaning contributor is most
      # likely to break with a one-line "fix".
      - name: The two invariants a one-line fix breaks
        run: uv run lint-imports --config importlinter.ini
      - name: Prove the gate still rejects a planted revision UPDATE
        run: |
          set -euo pipefail
          uv run python scripts/plant_violation.py --kind revision-update
          if uv run lint-imports --config importlinter.ini; then
            echo "::error::a planted UPDATE against a *_revision table was NOT detected"
            uv run python scripts/plant_violation.py --revert
            exit 1
          fi
          uv run python scripts/plant_violation.py --revert
          echo "planted revision UPDATE detected -- gate is live"
      # `no-covered-cache-write` was declared at S0 and had no code to constrain
      # until S4, so until this step it was passing *vacuously*. A gate that has
      # only ever been green on an empty tree is not evidence of anything, which
      # is why the proof lands in the same sprint as the first cache write.
      - name: Prove the gate still rejects a planted coverage-cache write
        run: |
          set -euo pipefail
          uv run python scripts/plant_violation.py --kind covered-cache-write
          if uv run lint-imports --config importlinter.ini; then
            echo "::error::a planted covered_cache write outside adopt_coverage was NOT detected"
            uv run python scripts/plant_violation.py --revert
            exit 1
          fi
          uv run python scripts/plant_violation.py --revert
          echo "planted coverage-cache write detected -- gate is live"
      # `no-provider-sdk` has been declared since S0 and, under CR-46, has
      # nothing to constrain: the owner decided the hosted adapters speak HTTP
      # over the standard library, so no vendor SDK is in the graph at all. That
      # makes the contract preventive rather than constraining -- and it makes
      # this proof matter *more*, because a forbidden-module list with no members
      # can be misconfigured and still report KEPT forever. `no-dbos` sat in
      # exactly that state inside this repository before S8.
      - name: Prove the gate still rejects a planted provider-SDK import
        run: |
          set -euo pipefail
          uv run python scripts/plant_violation.py --kind provider-sdk
          if uv run lint-imports --config importlinter.ini; then
            echo "::error::a planted provider-SDK import outside adopt_agent.adapters was NOT detected"
            uv run python scripts/plant_violation.py --revert
            exit 1
          fi
          uv run python scripts/plant_violation.py --revert
          echo "planted provider-SDK import detected -- gate is live"
      - name: The tree is exactly as it was found
        run: git diff --exit-code
      # The sprint plan's Final Output Validation greps both repositories.
      # **This job scans only this one, deliberately.** `adopt-core` is
      # Apache-2.0 and goes public at 0.3.0; giving a public repository's
      # workflow a credential that can read the closed one would put the licence
      # boundary behind a secret-rotation policy. The closed half of the scan
      # runs in `adopt-plane`'s own CI, which already checks out this repository
      # as a sibling and already declares `no-revision-update`.
      - name: No UPDATE against a revision table (open repository)
        run: |
          set -euo pipefail
          if grep -rEn "UPDATE[[:space:]]+[a-z_]*_revision" packages/; then
            echo "::error::an UPDATE targets a *_revision table"
            exit 1
          fi
          echo "no revision mutation under packages/"

  schema-check:
    name: schema-check (generated artifacts match the manifest)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
      - run: uv sync --all-packages
      - name: No drift between the manifest and its four targets
        run: uv run adopt-schema generate --check
      - name: Prove the gate still rejects a hand edit
        run: |
          set -euo pipefail
          printf '\n-- a hand edit\n' >> schema/migrations/sqlite/0001__init_v3.sql
          if uv run adopt-schema generate --check; then
            echo "::error::a hand-edited generated file was NOT detected as drift"
            exit 1
          fi
          git checkout -- schema/migrations/sqlite/0001__init_v3.sql
          echo "planted drift detected -- gate is live"

  schema-lint:
    name: schema-lint (additive-only against the base branch)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The linter reads a manifest from a git ref without checking it out,
          # so the ref has to be in the object store.
          fetch-depth: 0
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
      - run: uv sync --all-packages
      - name: Make the base branch available as origin/main
        run: git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
      - name: Additive-only against origin/main
        run: uv run adopt-schema lint --base origin/main
      - name: Prove the gate still rejects a removed column
        run: |
          set -euo pipefail
          # Guard first: if the base ref has no manifest the linter correctly
          # reports nothing, and a gate proof that cannot fail proves nothing.
          if ! git show HEAD~1:schema/canonical.yaml > /dev/null 2>&1; then
            echo "::error::HEAD~1 has no manifest, so this gate proof is vacuous"
            exit 1
          fi
          uv run python scripts/plant_violation.py --kind drop-column
          if uv run adopt-schema lint --base HEAD~1 2>&1 | tee /tmp/lint.txt; then
            uv run python scripts/plant_violation.py --revert
            echo "::error::a planted column removal was NOT rejected"
            exit 1
          fi
          grep -q "column-removed" /tmp/lint.txt
          uv run python scripts/plant_violation.py --revert
          echo "planted column removal rejected -- gate is live"

  schema-realize:
    name: schema-realize (SQLite and Postgres 16 apply the generated DDL)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    # A hang is not a failure until something says so. On 2026-08-19 this job's
    # `apt-get update` blocked on the apt lock for **45 minutes** and would have
    # run to GitHub's 360-minute default before anyone was told. The step below
    # can no longer block that way; this is the backstop for the next thing that
    # can, because "it stopped" and "it is still working" are the same
    # observation without a deadline.
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          # Ephemeral, CI-only, reachable only from this job's runner for the
          # life of the job. Not a secret, and deliberately not stored as one:
          # a repository secret implies something worth protecting.
          POSTGRES_PASSWORD: ci-only-not-a-secret
          POSTGRES_USER: postgres
          POSTGRES_DB: adopt_ci
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
        ports:
          - 5432:5432
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Three separate defects, all of which fired at once on 2026-08-19:
      #
      # 1. **It installed what the runner already has.** `ubuntu-24.04` ships
      #    `sqlite3` and `psql`. The whole step was avoidable work on the happy
      #    path and a hang risk on the unhappy one, so it now asks first. The
      #    check is not an optimization -- it is what removes the apt path
      #    entirely on a normal runner.
      # 2. **`apt-get update` waits on the apt lock forever.** The `apt-daily`
      #    and `unattended-upgrades` timers hold it for the first minutes after
      #    a runner boots, and this job drew a runner inside that window: the
      #    step emitted nothing for 45 minutes. `DPkg::Lock::Timeout` makes apt
      #    give up and exit non-zero instead, so a lock becomes a failure with a
      #    message rather than a job that never ends.
      # 3. **`-qq` suppressed the one line that explained it.** apt prints
      #    "Waiting for cache lock" at normal verbosity; `-qq` silences it, so
      #    the log recorded a step that had started and said nothing. That is
      #    `extractor_timings()` dropping `detail` (B1-CR-97) in a shell script:
      #    the quiet flag removed the diagnosis, not the noise.
      - name: Database clients
        run: |
          set -euo pipefail
          missing=()
          command -v sqlite3 >/dev/null || missing+=(sqlite3)
          command -v psql >/dev/null || missing+=(postgresql-client)
          if [ ${#missing[@]} -eq 0 ]; then
            echo "sqlite3 $(sqlite3 --version | cut -d' ' -f1) and $(psql --version) already present; nothing to install"
            exit 0
          fi
          echo "installing: ${missing[*]}"
          export DEBIAN_FRONTEND=noninteractive NEEDRESTART_MODE=a
          sudo apt-get -o DPkg::Lock::Timeout=120 update
          sudo apt-get -o DPkg::Lock::Timeout=120 install -y --no-install-recommends "${missing[@]}"
      - name: SQLite -- create version 3 and read it back
        run: |
          set -euo pipefail
          sqlite3 /tmp/v3.db < schema/migrations/sqlite/0001__init_v3.sql
          version="$(sqlite3 /tmp/v3.db 'PRAGMA user_version;')"
          echo "PRAGMA user_version = ${version}"
          test "${version}" = "3"
      - name: Postgres 16 -- apply the generated DDL and every derived policy
        env:
          PGPASSWORD: ci-only-not-a-secret
        run: |
          set -euo pipefail
          psql -h localhost -U postgres -d adopt_ci -v ON_ERROR_STOP=1 \
            -f schema/migrations/postgres/0001__init_v3.sql
      - name: Confirm row-level security is enabled and FORCEd where declared
        env:
          PGPASSWORD: ci-only-not-a-secret
        run: |
          set -euo pipefail
          psql -h localhost -U postgres -d adopt_ci -At -c \
            "SELECT count(*) FROM pg_class WHERE relrowsecurity AND relforcerowsecurity;" \
            | tee /tmp/rls_count.txt
          test "$(cat /tmp/rls_count.txt)" -gt 0
      - name: Upload the emitted DDL as review evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: emitted-ddl
          path: schema/migrations/**/*.sql

  metrics:
    name: metrics (PRD §6 success metrics)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    # `always()`, because a red gate is a data point rather than a reason to stop
    # measuring -- D1 is a *pass rate* and a run that only records its green days
    # reports 1.0 forever.
    if: always()
    needs:
      [
        golden-g0,
        schema-lint,
        append-only,
        lint,
        durability,
        conformance-matrix,
        build1-gates,
      ]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
      - run: uv sync --all-packages

      - name: Prove the §6 predicates still reject
        run: uv run python scripts/ci_metrics.py --self-test

      - name: Adapter verdicts, if the matrix ran
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        continue-on-error: true
        with:
          name: metrics-conformance

      # Every event below is derived from a gate's own result. Nothing here
      # re-judges a gate: §7's jobs decide pass or fail, and this records what
      # they decided. A second opinion is how two instruments disagree.
      - name: Record what the gates decided
        run: |
          set -euo pipefail
          emit() { uv run python scripts/ci_metrics.py --event "$1" --field "$2"; }

          # D1 -- G0 pass rate. Skipped is not green and not red; it is absent,
          # and recording it as either would corrupt the ratio.
          case "${{ needs.golden-g0.result }}" in
            success) emit g0_run green=true ;;
            failure) emit g0_run green=false ;;
          esac

          # D2 -- a caught non-additive attempt. `schema-lint` failing IS the
          # catch, which is why the numerator counts its failures.
          if [ "${{ needs.schema-lint.result }}" = "failure" ]; then
            emit schema_lint_violation caught=pre-merge
          fi

          # North star. `append-only` covers the revision and covered_cache
          # invariants; `lint` carries `no-provider-sdk`, `no-dbos` and
          # `no-foreign-tables`. A failure here is a Build 0 defect by PRD §6's
          # own words, not a downstream team's style choice.
          if [ "${{ needs.append-only.result }}" = "failure" ]; then
            emit forked_revision_chain source=append-only
          fi
          if [ "${{ needs.lint.result }}" = "failure" ]; then
            emit agent.sdk_import_violation source=import-contracts
          fi

      - name: Summarize
        run: uv run python scripts/ci_metrics.py --summarize

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: ci-metrics
          path: ci-metrics.jsonl
          if-no-files-found: ignore
