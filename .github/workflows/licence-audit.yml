name: licence-audit

# The same gate as `ci.yml`, on a schedule rather than on a diff.
#
# Dependencies relicense between our commits. A gate that only fires when
# something in this repository changes will not notice that a dependency
# changed underneath it -- and the first anyone hears of it is a customer's
# procurement review.

on:
  schedule:
    # Mondays, 06:00 UTC. Early enough that a failure is triaged the same day.
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  audit:
    name: weekly licence audit
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --all-packages

      - name: Prove the gate still rejects
        run: uv run python scripts/licence_gate.py --self-test

      - name: Audit the installed tree
        id: audit
        run: uv run python scripts/licence_gate.py --check | tee audit.log

      - name: Report re-verification dates that have lapsed
        # Non-blocking on the schedule: a lapsed date is a task, not an
        # outage. It becomes blocking at the release gate, where
        # --strict-verify refuses to ship an unaudited or overdue dependency.
        continue-on-error: true
        run: uv run python scripts/licence_gate.py --check --strict-verify

      - name: Upload the audit log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: licence-audit-log
          path: audit.log
          retention-days: 90
