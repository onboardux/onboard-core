name: release

# The private publish=false route is a diagnostic only: GitHub cannot persist
# attestations for this user-owned private repository. Once adopt-core is public,
# every route is strict. Publication is a separate manual dispatch on the exact
# v<workspace-version> tag and is protected by the `release` environment.

on:
  workflow_dispatch:
    inputs:
      publish:
        description: "Publish from the selected release tag"
        type: boolean
        default: false
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build:
    name: build
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.context.outputs.version }}
      tag: ${{ steps.context.outputs.tag }}
      distribution_count: ${{ steps.context.outputs.distribution_count }}
      distributions: ${{ steps.context.outputs.distributions }}
      sbom_sha256: ${{ steps.facts.outputs.sbom_sha256 }}
      build_id: ${{ steps.facts.outputs.build_id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true
          version: "0.9.5"

      - name: The committed lock is authoritative
        run: |
          set -euo pipefail
          uv lock --check
          uv sync --frozen --all-packages --no-dev

      - name: Validate the lockstep version, tag and publication route
        id: context
        env:
          PUBLISH_REQUESTED: ${{ inputs.publish || false }}
        run: >-
          uv run --frozen --no-dev python -m scripts.release_context
          --event-name "${{ github.event_name }}"
          --ref "${{ github.ref }}"
          --publish "$PUBLISH_REQUESTED"
          --github-output "$GITHUB_OUTPUT"

      # This constraints file makes every binary job install the exact runtime
      # closure used to construct the SBOM, on all three operating systems.
      - name: Freeze the runtime closure
        run: >-
          uv export --frozen --all-packages --no-dev --no-emit-workspace
          --no-hashes --no-annotate --no-header
          --output-file runtime-constraints.txt

      # The release environment contains only the lock's runtime closure. The
      # SBOM therefore describes what the wheels and binaries carry, not pytest,
      # mypy or another development-only tool.
      - name: CycloneDX SBOM
        run: >-
          uv run --frozen --no-dev python -m scripts.emit_sbom
          --out dist/sbom.cdx.json
          --name adopt-core
          --version "${{ steps.context.outputs.version }}"

      # Build facts are generated before any artifact. A runtime environment
      # variable would disappear at process exit and leave an installed wheel
      # reporting null, so the workflow stamps a tracked module in this
      # ephemeral checkout and every later artifact receives the same bytes.
      - name: Embed immutable build facts
        id: facts
        run: |
          set -euo pipefail
          build_id="github:${GITHUB_REPOSITORY}:${GITHUB_RUN_ID}:${GITHUB_RUN_ATTEMPT}:${GITHUB_SHA}"
          uv run --frozen --no-dev python -m scripts.embed_build_info \
            --sbom dist/sbom.cdx.json \
            --build-id "$build_id"
          sbom_sha256="$(sha256sum dist/sbom.cdx.json | cut -d ' ' -f 1)"
          echo "sbom_sha256=$sbom_sha256" >> "$GITHUB_OUTPUT"
          echo "build_id=$build_id" >> "$GITHUB_OUTPUT"

      - name: Build all 15 Python distributions
        run: uv build --all-packages --out-dir dist/

      # Every source distribution and wheel is published together. Counting
      # them here prevents a glob or a newly added package from silently
      # producing a partial release artifact.
      - name: Refuse a partial Python distribution set
        shell: bash
        run: |
          set -euo pipefail
          expected="${{ steps.context.outputs.distribution_count }}"
          wheels="$(find dist -maxdepth 1 -type f -name '*.whl' | wc -l)"
          sdists="$(find dist -maxdepth 1 -type f -name '*.tar.gz' | wc -l)"
          test "$wheels" -eq "$expected" || {
            echo "::error::expected $expected wheels, found $wheels" >&2
            exit 1
          }
          test "$sdists" -eq "$expected" || {
            echo "::error::expected $expected source distributions, found $sdists" >&2
            exit 1
          }

      - name: The installed wheel is self-contained and stamped
        shell: bash
        env:
          EXPECTED_VERSION: ${{ steps.context.outputs.version }}
          EXPECTED_DISTRIBUTION_COUNT: ${{ steps.context.outputs.distribution_count }}
          FIRST_PARTY_DISTRIBUTIONS: ${{ steps.context.outputs.distributions }}
          EXPECTED_SBOM_SHA256: ${{ steps.facts.outputs.sbom_sha256 }}
          EXPECTED_BUILD_ID: ${{ steps.facts.outputs.build_id }}
        run: |
          set -euo pipefail
          work="$(mktemp -d)"
          uv venv "$work/venv"
          uv pip install \
            --python "$work/venv/bin/python" \
            --requirement runtime-constraints.txt
          first_party=()
          for distribution in $FIRST_PARTY_DISTRIBUTIONS; do
            first_party+=("${distribution}==${EXPECTED_VERSION}")
          done
          test "${#first_party[@]}" -eq "$EXPECTED_DISTRIBUTION_COUNT"
          uv pip install \
            --python "$work/venv/bin/python" \
            --no-index \
            --find-links dist/ \
            --no-deps \
            "${first_party[@]}"
          cd "$work"
          version_json="$("$work/venv/bin/adopt" version --json)"
          printf '%s\n' "$version_json"
          VERSION_JSON="$version_json" "$work/venv/bin/python" - <<'PY'
          import json
          import os

          payload = json.loads(os.environ["VERSION_JSON"])
          expected = {
              "version": os.environ["EXPECTED_VERSION"],
              "schema_version": 3,
              "export_version": 3,
              "sbom_sha256": os.environ["EXPECTED_SBOM_SHA256"],
              "build_id": os.environ["EXPECTED_BUILD_ID"],
          }
          assert payload == expected, (payload, expected)
          PY
          "$work/venv/bin/adopt" detect "$work" --json > "$work/detect.json" || true
          grep -q '"scores"' "$work/detect.json"
          "$work/venv/bin/adopt" store migrate --store "$work/s.db" --json
          "$work/venv/bin/adopt" store info --store "$work/s.db" --json \
            | grep -q '"schema_version": *3'

      # PyPI accepts only Python distributions. This artifact must never contain
      # the SBOM, binaries, signatures or provenance from release-bundle.
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pypi-dist
          path: |
            dist/*.whl
            dist/*.tar.gz
          if-no-files-found: error

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-sbom
          path: dist/sbom.cdx.json
          if-no-files-found: error

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: runtime-constraints
          path: runtime-constraints.txt
          if-no-files-found: error

  binaries:
    name: single-file binary (${{ matrix.os }})
    needs: build
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            artefact: adopt-linux-x86_64
          - os: macos-14
            artefact: adopt-macos-arm64
          - os: windows-2022
            artefact: adopt-windows-x86_64.exe
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.9.5"

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: pypi-dist
          path: dist/

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: runtime-constraints
          path: .

      # Nuitka is deliberately isolated from uv.lock: it is a build tool, not a
      # distributed dependency. The program itself is installed from the exact
      # wheels and runtime constraints produced by the build job.
      - name: Install the published wheel into a clean environment
        shell: bash
        env:
          EXPECTED_VERSION: ${{ needs.build.outputs.version }}
          EXPECTED_DISTRIBUTION_COUNT: ${{ needs.build.outputs.distribution_count }}
          FIRST_PARTY_DISTRIBUTIONS: ${{ needs.build.outputs.distributions }}
        run: |
          set -euo pipefail
          uv venv build-env
          PY=build-env/bin/python
          [ -x "$PY" ] || PY=build-env/Scripts/python.exe
          echo "PY=$PY" >> "$GITHUB_ENV"
          uv pip install --python "$PY" nuitka==4.1.3
          uv pip install \
            --python "$PY" \
            --requirement runtime-constraints.txt
          first_party=()
          for distribution in $FIRST_PARTY_DISTRIBUTIONS; do
            first_party+=("${distribution}==${EXPECTED_VERSION}")
          done
          test "${#first_party[@]}" -eq "$EXPECTED_DISTRIBUTION_COUNT"
          uv pip install \
            --python "$PY" \
            --no-index \
            --find-links dist/ \
            --no-deps \
            "${first_party[@]}"

      - name: Pack
        shell: bash
        run: |
          set -euo pipefail
          MAIN="$("$PY" -c 'import importlib.util as u; print(u.find_spec("adopt_cli.main").origin)')"
          echo "packing $MAIN"
          "$PY" -m nuitka \
            --onefile \
            --assume-yes-for-downloads \
            --include-package-data=adopt_agent \
            --include-package-data=adopt_detect \
            --include-package-data=adopt_schema \
            --include-distribution-metadata=adopt-cli \
            --output-dir=packed \
            --output-filename=${{ matrix.artefact }} \
            "$MAIN"

      - name: Enforce the governed binary size ceiling
        shell: bash
        run: |
          set -euo pipefail
          BIN="$PWD/packed/${{ matrix.artefact }}"
          "$PY" - "$BIN" "$GITHUB_STEP_SUMMARY" <<'PY'
          import sys
          from pathlib import Path

          from adopt_const import BINARY_MAX_MB

          bytes_per_mib = 1024 * 1024
          binary = Path(sys.argv[1])
          summary_path = Path(sys.argv[2])
          size_bytes = binary.stat().st_size
          limit_bytes = BINARY_MAX_MB * bytes_per_mib
          result = "PASS" if size_bytes <= limit_bytes else "FAIL"
          message = (
              f"{binary.name}: {size_bytes} exact bytes "
              f"({size_bytes / bytes_per_mib:.2f} MiB); "
              f"limit {limit_bytes} bytes ({BINARY_MAX_MB} MiB): {result}"
          )
          print(message)
          with summary_path.open("a", encoding="utf-8", newline="\n") as summary:
              summary.write("### Single-file binary size\n\n")
              summary.write("| Artifact | Exact bytes | MiB | Limit bytes | Result |\n")
              summary.write("|---|---:|---:|---:|---|\n")
              summary.write(
                  f"| `{binary.name}` | {size_bytes} | "
                  f"{size_bytes / bytes_per_mib:.2f} | {limit_bytes} | {result} |\n"
              )
          if size_bytes > limit_bytes:
              print(f"::error::{message}", file=sys.stderr)
              raise SystemExit(1)
          PY

      - name: It runs and reports the exact release build
        shell: bash
        env:
          EXPECTED_VERSION: ${{ needs.build.outputs.version }}
          EXPECTED_SBOM_SHA256: ${{ needs.build.outputs.sbom_sha256 }}
          EXPECTED_BUILD_ID: ${{ needs.build.outputs.build_id }}
        run: |
          set -euo pipefail
          BIN="$PWD/packed/${{ matrix.artefact }}"
          version_json="$("$BIN" version --json)" || {
            status=$?
            echo "::error::packed binary version command exited $status" >&2
            exit "$status"
          }
          test -n "$version_json" || {
            echo "::error::packed binary exited 0 but produced no version JSON" >&2
            exit 1
          }
          printf '%s\n' "$version_json"
          VERSION_JSON="$version_json" "$PY" - <<'PY'
          import json
          import os

          payload = json.loads(os.environ["VERSION_JSON"])
          expected = {
              "version": os.environ["EXPECTED_VERSION"],
              "schema_version": 3,
              "export_version": 3,
              "sbom_sha256": os.environ["EXPECTED_SBOM_SHA256"],
              "build_id": os.environ["EXPECTED_BUILD_ID"],
          }
          assert payload == expected, (payload, expected)
          PY

      - name: It carries its detect rules, migrations and annex DDL
        shell: bash
        run: |
          set -euo pipefail
          BIN="$PWD/packed/${{ matrix.artefact }}"
          work="$(mktemp -d)"
          "$BIN" detect "$work" --json > "$work/detect.json" || true
          grep -q '"scores"' "$work/detect.json"
          "$BIN" store migrate --store "$work/s.db" --json
          "$BIN" store info --store "$work/s.db" --json \
            | grep -q '"schema_version": *3'

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: binary-${{ matrix.artefact }}
          path: packed/${{ matrix.artefact }}
          if-no-files-found: error

  supply-chain:
    name: SBOM, provenance, signatures
    needs: [build, binaries]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write
      attestations: write
    env:
      ALLOW_MISSING_PROVENANCE: ${{ github.event_name == 'workflow_dispatch' && github.event.repository.private == true && inputs.publish == false }}
      GH_TOKEN: ${{ github.token }}
      CERTIFICATE_IDENTITY: ${{ github.server_url }}/${{ github.workflow_ref }}
      CERTIFICATE_OIDC_ISSUER: https://token.actions.githubusercontent.com
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.9.5"
      - run: |
          uv lock --check
          uv sync --frozen --all-packages --no-dev

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: pypi-dist
          path: dist/

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-sbom
          path: dist/

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: binary-*
          path: dist/
          merge-multiple: true

      - name: Licence gate at release strictness
        run: uv run --frozen --no-dev python scripts/licence_gate.py --check --strict-verify

      - name: SLSA provenance
        id: provenance
        if: ${{ env.ALLOW_MISSING_PROVENANCE != 'true' }}
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: "dist/*"

      - name: Add SLSA provenance to the release bundle
        if: ${{ steps.provenance.outcome == 'success' }}
        run: cp "${{ steps.provenance.outputs.bundle-path }}" dist/provenance.intoto.jsonl

      - name: Verify provenance covers every exact payload
        if: ${{ env.ALLOW_MISSING_PROVENANCE != 'true' }}
        run: |
          set -euo pipefail
          for artefact in dist/*; do
            [ -f "$artefact" ] || continue
            case "$artefact" in *.sig|*.pem|*.intoto.jsonl) continue;; esac
            gh attestation verify "$artefact" \
              --bundle dist/provenance.intoto.jsonl \
              --limit 100 \
              --repo "$GITHUB_REPOSITORY" \
              --cert-identity "$CERTIFICATE_IDENTITY" \
              --cert-oidc-issuer "$CERTIFICATE_OIDC_ISSUER" \
              --predicate-type https://slsa.dev/provenance/v1
          done

      - name: Explain private dry-run provenance boundary
        if: ${{ env.ALLOW_MISSING_PROVENANCE == 'true' }}
        run: >-
          echo "::notice::GitHub cannot persist SLSA provenance while adopt-core is a
          private user-owned repository. This publish=false diagnostic continues without
          provenance; make the repository public before the final strict release dry run."

      - name: Install cosign
        uses: sigstore/cosign-installer@398d4b0eeef1380460a10c8013a76f728fb906ac # v3.9.1
        with:
          cosign-release: "v2.6.3"

      - name: Sign every payload
        run: |
          set -euo pipefail
          for artefact in dist/*; do
            [ -f "$artefact" ] || continue
            case "$artefact" in *.sig|*.pem|*.intoto.jsonl) continue;; esac
            cosign sign-blob --yes \
              --output-signature "$artefact.sig" \
              --output-certificate "$artefact.pem" \
              "$artefact"
          done

      - name: Verify every signature against this exact workflow
        run: |
          set -euo pipefail
          for artefact in dist/*; do
            [ -f "$artefact" ] || continue
            case "$artefact" in *.sig|*.pem|*.intoto.jsonl) continue;; esac
            cosign verify-blob \
              --certificate "$artefact.pem" \
              --signature "$artefact.sig" \
              --certificate-identity "$CERTIFICATE_IDENTITY" \
              --certificate-oidc-issuer "$CERTIFICATE_OIDC_ISSUER" \
              "$artefact"
          done

      - name: Refuse to proceed unless the release is complete
        run: >-
          uv run --frozen --no-dev python -m scripts.assert_release_complete
          --dir dist/
          --version "${{ needs.build.outputs.version }}"
          --python-distributions "${{ needs.build.outputs.distribution_count }}"
          ${{ env.ALLOW_MISSING_PROVENANCE == 'true' && '--allow-missing-provenance' || '' }}

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-bundle
          path: dist/
          if-no-files-found: error

  publish:
    name: publish PyPI
    needs: [build, supply-chain]
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.publish == true && github.ref == format('refs/tags/{0}', needs.build.outputs.tag) }}
    runs-on: ubuntu-24.04
    environment: release
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: pypi-dist
          path: dist/

      - name: Publish only wheels and source distributions to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          packages-dir: dist/
          skip-existing: false

  github-release:
    name: publish GitHub Release
    needs: [build, supply-chain, publish]
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.publish == true && github.ref == format('refs/tags/{0}', needs.build.outputs.tag) }}
    runs-on: ubuntu-24.04
    environment: release
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      # This job deliberately does not check out the repository. Tell `gh`
      # which remote to use instead of relying on a nonexistent local git remote.
      GH_REPO: ${{ github.repository }}
      CERTIFICATE_IDENTITY: ${{ github.server_url }}/${{ github.workflow_ref }}
      CERTIFICATE_OIDC_ISSUER: https://token.actions.githubusercontent.com
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-bundle
          path: dist/

      - name: Install cosign
        uses: sigstore/cosign-installer@398d4b0eeef1380460a10c8013a76f728fb906ac # v3.9.1
        with:
          cosign-release: "v2.6.3"

      - name: Verify downloaded release assets
        run: |
          set -euo pipefail
          for artefact in dist/*; do
            [ -f "$artefact" ] || continue
            case "$artefact" in *.sig|*.pem|*.intoto.jsonl) continue;; esac
            cosign verify-blob \
              --certificate "$artefact.pem" \
              --signature "$artefact.sig" \
              --certificate-identity "$CERTIFICATE_IDENTITY" \
              --certificate-oidc-issuer "$CERTIFICATE_OIDC_ISSUER" \
              "$artefact"
            gh attestation verify "$artefact" \
              --bundle dist/provenance.intoto.jsonl \
              --limit 100 \
              --repo "$GITHUB_REPOSITORY" \
              --cert-identity "$CERTIFICATE_IDENTITY" \
              --cert-oidc-issuer "$CERTIFICATE_OIDC_ISSUER" \
              --predicate-type https://slsa.dev/provenance/v1
          done

      - name: Create the release from the existing tag
        run: >-
          gh release create "$GITHUB_REF_NAME" dist/*
          --verify-tag
          --generate-notes
          --title "adopt-core ${GITHUB_REF_NAME#v}"
