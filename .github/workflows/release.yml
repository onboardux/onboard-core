name: release

# WIRED, NOT PUBLISHING.
#
# Every step below runs against scripts that exist today. The two steps that put
# bytes in front of a user -- the PyPI upload and the GitHub release -- are gated
# on `inputs.publish`, which defaults to false and stays false until S9.
#
# Wiring it now rather than at S9 is deliberate. Supply-chain duties are the part
# of a release most often discovered to be missing on the day of the release, and
# a release missing an SBOM, provenance or a signature is not a release
# (PRD F15.6, NFR N14). The machinery is proven months before it is needed.
#
# THE PACKER, decided at S9 (CR-51). The three single-file platform binaries are
# built with **Nuitka (Apache-2.0)**, pinned inside an ephemeral build environment
# so it never enters `uv.lock` -- the same isolation CR-49 chose for `pip-audit`,
# and for the same reason: a build tool's ~4 transitive dependencies should not
# each become a seven-field verification obligation (CR-54).
#
# **PyInstaller was rejected, and not on a technicality.** Its bootloader is
# compiled into the shipped artefact, so it is `in-binary` by `03` §7.3's own
# definition, and that mode is "permissive only. No copyleft, ever." The GPL-2.0
# linking exception means the obligation never actually bites -- and CR-46 set
# the precedent of refusing on the transitive licence rather than on whether an
# obligation triggers, when it kept both official provider SDKs out over MPL-2.0
# `certifi` and `tqdm`. Softening that here would widen the rule for every
# future dependency, not just this one.
#
# !! THIS JOB HAS EXECUTED, BUT HAS NOT YET COMPLETED GREEN. !! Four dry runs
# successively exposed missing package data, an editable-install metadata gap, a
# onefile-only path-depth crash, and finally a binary that exited 0 without ever
# invoking the CLI (CR-53 .. CR-56). If it fails, drop `binaries` from
# `supply-chain.needs` to ship the wheel while it is fixed -- the wheel path is
# proven and the binaries are additive.

on:
  workflow_dispatch:
    inputs:
      publish:
        description: "Publish the artefacts. Leave false until S9."
        type: boolean
        default: false
  push:
    tags: ["v*"]

permissions:
  contents: read
  id-token: write
  attestations: write

jobs:
  build:
    name: build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - run: uv sync --all-packages

      - name: Build the wheels
        run: uv build --all-packages --out-dir dist/

      # **The wheel that cannot create a store passes every test in the suite**,
      # because the suite runs against an editable install where `parents[4]`
      # still lands in the checkout (CR-53). Nothing in CI had ever installed a
      # built wheel and used it, so `schema/` being absent from the artefact was
      # invisible until a packed binary made it fatal at import.
      #
      # This installs the artefact into a clean environment -- no checkout on the
      # path to fall back to -- and runs the two commands that must open a
      # packaged file to answer. It is the wheel-side twin of the binaries smoke
      # test, and it is the cheaper of the two: it needs no C toolchain and it
      # fails in seconds.
      - name: The installed wheel is self-contained
        run: |
          set -euo pipefail
          work="$(mktemp -d)"
          uv venv "$work/venv"
          uv pip install --python "$work/venv/bin/python" --find-links dist/ adopt-cli
          cd "$work"          # nowhere near the checkout, so no fallback can hide a gap
          "$work/venv/bin/adopt" version --json | grep -q '"schema_version": *3'
          "$work/venv/bin/adopt" detect "$work" --json > "$work/detect.json" || true
          grep -q '"scores"' "$work/detect.json"
          "$work/venv/bin/adopt" store migrate --store "$work/s.db" --json
          "$work/venv/bin/adopt" store info --store "$work/s.db" --json | grep -q '"schema_version": *3'

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  binaries:
    name: single-file binary (${{ matrix.os }})
    needs: build
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            artefact: adopt-linux-x86_64
          - os: macos-14
            artefact: adopt-macos-arm64
          - os: windows-2022
            artefact: adopt-windows-x86_64.exe
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5

      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      # **The binary is packed from the wheels we publish, not from the source
      # tree** (CR-54). This job used to `uv sync --all-packages` and point
      # Nuitka at `packages/adopt-cli/src/adopt_cli/main.py`, and that is an
      # *editable* install: its `dist-info/RECORD` lists a single `.pth` shim and
      # no `adopt_cli/` files at all. Two things follow, and the second is worse
      # than the error that exposed it:
      #
      #   1. `--include-distribution-metadata=adopt-cli` failed outright --
      #      *"including metadata for distribution 'adopt-cli' without including
      #      related package 'adopt-cli'"*. Nuitka could not map the distribution
      #      to a package, because nothing in the metadata names one, so it fell
      #      back to the distribution name and looked for an importable
      #      `adopt-cli`. There is no flag that fixes this; the install is the
      #      problem.
      #   2. `--include-package-data=adopt_schema` **could never have worked from
      #      a checkout**, because `_assets/schema/` exists only inside a built
      #      wheel. The packaging fix from CR-53 would have been silently absent
      #      from every binary, and the smoke test would have caught it -- one
      #      more round of a failure we had already diagnosed.
      #
      # Installing the artefact makes the binary a function of what we publish,
      # which is what a supply chain requires anyway: the wheel is signed, and a
      # binary compiled from a different tree is a second thing to trust.
      - name: Install the published wheel into a clean environment
        shell: bash
        run: |
          set -euo pipefail
          uv venv build-env
          PY=build-env/bin/python
          [ -x "$PY" ] || PY=build-env/Scripts/python.exe
          echo "PY=$PY" >> "$GITHUB_ENV"
          # Nuitka is installed *into this ephemeral environment* rather than
          # run through `uvx`. The isolation CR-51 wanted is preserved -- it
          # still never enters `uv.lock` -- but it must import the same packages
          # it is compiling, which a separate tool environment cannot do.
          # Pinned: this job produces a signed artefact, and the failure above
          # was Nuitka-version-specific behaviour (CR-54).
          uv pip install --python "$PY" --find-links dist/ adopt-cli nuitka==4.1.3

      # `--onefile` is the "single-file binary per platform" `03` §1.1 locks.
      # `--assume-yes-for-downloads` keeps the job non-interactive; without it
      # Nuitka blocks on a prompt for its C toolchain and the job times out
      # rather than failing.
      #
      # **Nuitka ships no package data unless told, and the first run of this job
      # proved it** (CR-53). It followed the import graph, compiled every module,
      # and produced a binary that died on its first import: `adopt_agent.pricing`
      # reads `prices.json` from beside itself at module scope. Three data sets
      # have to be named, and they are named separately rather than by a wildcard
      # so that a fourth is a build failure here rather than a `FileNotFoundError`
      # in front of an operator:
      #
      #   * `adopt_agent`   -- `prices.json`, read at import.
      #   * `adopt_detect`  -- `rules/*.yaml`, read lazily by `adopt detect`.
      #   * `adopt_schema`  -- `_assets/schema/`, the manifest, the migrations and
      #                        the annex DDL, placed there by `hatch_build.py`.
      #
      # `--include-distribution-metadata` is for `adopt version`: without it
      # `importlib.metadata` finds nothing and the binary reports itself as
      # `0.0.0+unknown`, which defeats the one job that command has -- tying an
      # artefact in the field back to the one that was signed.
      - name: Pack
        shell: bash
        run: |
          set -euo pipefail
          # The installed entry point, asked of the interpreter that will compile
          # it. `adopt_cli/__init__.py` re-exports `main` as a *function*, so
          # `adopt_cli.main.__file__` is an AttributeError -- `find_spec` asks
          # about the module rather than about whatever the name is bound to.
          MAIN="$("$PY" -c 'import importlib.util as u; print(u.find_spec("adopt_cli.main").origin)')"
          echo "packing $MAIN"
          "$PY" -m nuitka \
            --onefile \
            --assume-yes-for-downloads \
            --include-package-data=adopt_agent \
            --include-package-data=adopt_detect \
            --include-package-data=adopt_schema \
            --include-distribution-metadata=adopt-cli \
            --output-dir=packed \
            --output-filename=${{ matrix.artefact }} \
            "$MAIN"

      # **`version --json` alone is not a smoke test of a packed binary**, and
      # CR-53 is the proof. It reads two constants and touches no data file, so
      # it passes against a binary carrying none -- it only failed above because
      # `prices.json` happens to be read at *import* time. Everything read
      # lazily -- the detect rules, the migrations, the annex DDL -- stayed
      # invisible to it. That is this build's recurring failure exactly: a check
      # that passes by never reaching the thing it is meant to judge.
      #
      # So the smoke test runs one command per packaged data set, and each is
      # chosen because it *must* open the file to answer at all.
      - name: It runs, and reports schema version 3
        shell: bash
        run: |
          set -euo pipefail
          BIN="$PWD/packed/${{ matrix.artefact }}"
          version_json="$("$BIN" version --json)" || {
            status=$?
            echo "::error::packed binary version command exited $status" >&2
            exit "$status"
          }
          if [ -z "$version_json" ]; then
            echo "::error::packed binary exited 0 but produced no version JSON" >&2
            exit 1
          fi
          printf '%s\n' "$version_json"
          printf '%s\n' "$version_json" | grep -q '"schema_version": *3' || {
            echo "::error::packed binary did not report schema_version 3" >&2
            exit 1
          }
          # Not `0.0.0+unknown`: the binary must know which artefact it is.
          printf '%s\n' "$version_json" | grep -q '"version": *"[0-9]' || {
            echo "::error::packed binary did not report a release version" >&2
            exit 1
          }

      - name: It carries its data -- detect rules, migrations, annex DDL
        shell: bash
        run: |
          set -euo pipefail
          BIN="$PWD/packed/${{ matrix.artefact }}"
          work="$(mktemp -d)"

          # adopt_detect/rules/*.yaml. `detect` exits 2 on an empty directory by
          # design -- a proposal is never a decision -- so the assertion is on
          # the payload, which only a loaded rule set can produce.
          "$BIN" detect "$work" --json > "$work/detect.json" || true
          grep -q '"scores"' "$work/detect.json"

          # adopt_schema/_assets: the manifest and the sqlite migration. This is
          # the one that was broken from a wheel as well as from a binary, and
          # it failed as `no such table: firm` rather than as a missing file.
          "$BIN" store migrate --store "$work/s.db" --json
          "$BIN" store info --store "$work/s.db" --json | grep -q '"schema_version": *3'

      - uses: actions/upload-artifact@v4
        with:
          name: binary-${{ matrix.artefact }}
          path: packed/${{ matrix.artefact }}

  supply-chain:
    name: SBOM, provenance, signatures
    needs: [build, binaries]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --all-packages

      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      # Every binary lands beside the wheel, so the SBOM, the provenance
      # attestation, the signatures and the BINARY_MAX_MB assertion all cover
      # them without a second code path.
      - uses: actions/download-artifact@v4
        with:
          pattern: binary-*
          path: dist/
          merge-multiple: true

      - name: Licence gate at release strictness
        # Blocks on any dependency still `pending-audit`, any lapsed
        # re-verification date, and any installed distribution with no row.
        # This is the gate that currently, correctly, refuses to ship.
        run: uv run python scripts/licence_gate.py --check --strict-verify

      - name: CycloneDX SBOM
        run: >-
          uv run python -m scripts.emit_sbom
          --out dist/sbom.cdx.json
          --name adopt-core
          --version ${{ github.ref_name }}

      - name: SLSA provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: "dist/*"

      - name: Install cosign
        uses: sigstore/cosign-installer@v3

      - name: Sign every artefact
        run: |
          set -euo pipefail
          for artefact in dist/*; do
            [ -f "$artefact" ] || continue
            case "$artefact" in *.sig|*.pem|*.intoto.jsonl) continue;; esac
            cosign sign-blob --yes \
              --output-signature "$artefact.sig" \
              --output-certificate "$artefact.pem" \
              "$artefact"
          done

      - name: Refuse to proceed unless the release is complete
        # SBOM present and non-empty, a signature beside every artefact,
        # provenance attested, and nothing over BINARY_MAX_MB.
        run: uv run python -m scripts.assert_release_complete --dir dist/

      - uses: actions/upload-artifact@v4
        with:
          name: release-bundle
          path: dist/

  publish:
    name: publish (disabled until S9)
    needs: supply-chain
    if: ${{ inputs.publish == true }}
    runs-on: ubuntu-24.04
    environment: release
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: release-bundle
          path: dist/

      - name: Install cosign
        uses: sigstore/cosign-installer@v3

      - name: Verify every signature before publishing anything
        run: |
          set -euo pipefail
          for artefact in dist/*; do
            case "$artefact" in *.sig|*.pem|*.intoto.jsonl) continue;; esac
            cosign verify-blob \
              --certificate "$artefact.pem" \
              --signature "$artefact.sig" \
              --certificate-identity-regexp '.*' \
              --certificate-oidc-issuer-regexp '.*' \
              "$artefact"
          done

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/
          skip-existing: false
