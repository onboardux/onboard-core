openapi: 3.1.0
info:
  title: Orders API
  version: 1.0.0
paths:
  "/api/v1/orders/":
    get:
      operationId: listOrders
      summary: listOrders
      tags: [orders]
      responses:
        "200":
          description: response 200
    post:
      operationId: createOrder
      summary: createOrder
      tags: [orders]
      responses:
        "201":
          description: response 201
        "400":
          description: response 400
  "/api/v1/orders/{order_id}/":
    get:
      operationId: getOrder
      summary: getOrder
      tags: [orders]
      parameters:
        - name: order_id
          in: path
          required: true
          schema: {type: integer}
      responses:
        "200":
          description: response 200
        "404":
          description: response 404
    delete:
      operationId: deleteOrder
      summary: deleteOrder
      tags: [orders]
      parameters:
        - name: order_id
          in: path
          required: true
          schema: {type: integer}
      responses:
        "204":
          description: response 204
        "404":
          description: response 404
  "/api/v1/billing/invoices/":
    get:
      operationId: listInvoices
      summary: listInvoices
      tags: [orders]
      responses:
        "200":
          description: response 200
  "/api/v1/catalog/products/":
    get:
      operationId: listProducts
      summary: listProducts
      tags: [orders]
      responses:
        "200":
          description: response 200
