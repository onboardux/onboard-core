syntax = "proto3";

package orders.v1;

service OrderService {
  rpc GetOrder (GetOrderRequest) returns (Order);
  rpc ListOrders (ListOrdersRequest) returns (stream Order);
  rpc CancelOrder (CancelOrderRequest) returns (Order);
}

service ShipmentService {
  rpc TrackShipment (TrackShipmentRequest) returns (Shipment);
}

message GetOrderRequest { string reference = 1; }
message ListOrdersRequest { string status = 1; }
message CancelOrderRequest { string reference = 1; string reason = 2; }
message TrackShipmentRequest { string tracking = 1; }
message Order { string reference = 1; string status = 2; }
message Shipment { string tracking = 1; }
