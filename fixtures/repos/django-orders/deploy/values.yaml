replicaCount: 3
image:
  repository: registry.example.com/orders
  tag: "1.42.0"
  pullPolicy: IfNotPresent
resources:
  limits:
    cpu: "2"
    memory: 2Gi
  requests:
    cpu: "500m"
    memory: 512Mi
autoscaling:
  enabled: true
  minReplicas: 3
  maxReplicas: 20
  targetCPUUtilizationPercentage: 70
ingress:
  enabled: true
  host: orders.example.com
probes:
  livenessPath: /healthz/
  readinessPath: /healthz/
