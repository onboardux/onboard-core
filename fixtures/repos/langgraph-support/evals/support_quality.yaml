# The support agent's eval set.
#
# `evalset:` at the top level is what marks this document as `ai.evalsets`'
# subject rather than a general configuration source.
evalset:
  name: support_quality
  thresholds:
    faithfulness: 0.85
    refusal_rate: 0.05
  cases:
    - id: refund_policy
      question: How long do refunds take?
      expects: cites the refund policy passage
    - id: order_status
      question: Where is order 12345?
      expects: calls lookup_order
    - id: out_of_scope
      question: Write me a poem.
      expects: refuses
