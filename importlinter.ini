; --------------------------------------------------------------------------
; 9. no-foreign-tables (custom) -- CREATE TABLE only in generated migrations
;    and in the emitters that generate them from the manifest (CR-24). The rule
;    forbids a table the canonical manifest does not know about; the emitter is
;    the code that reads the manifest, so exempting it narrows nothing.
;
;    `schema/annex` is the third allowed path and it is the awkward one, so the
;    reason is recorded rather than assumed (CR-45). The rule's purpose is to
;    forbid a table the canonical manifest does not know about -- and contracts
;    §12's `agent_run` is, by owner ratification (CR-08, 2026-08-06), exactly
;    such a table: a runtime annex outside `schema_version` and outside the
;    export, deliberately unknown to the manifest. So the rule as written
;    forbids precisely what the pack ratified. This is CR-24's situation
;    restated, and it is answered the same way: exempt by path with the reason
;    written down, rather than rewriting the DDL to dodge the check. Dodging it
;    -- assembling `CREATE` and `TABLE` at runtime, say -- would have been the
;    worse outcome, because a gate people route around is a gate that has
;    stopped meaning anything.
;
;    The exemption is one directory holding one hand-written file. Everything
;    under `schema/migrations` is still generated, and `packages/` still has no
;    `CREATE TABLE` anywhere: `adopt_store.annex` reads this DDL from the file
;    rather than carrying it as a literal, which is what keeps the exemption
;    from widening to "the store may declare tables".
; --------------------------------------------------------------------------
[importlinter:contract:no-foreign-tables]
name = no-foreign-tables -- CREATE TABLE exists only in schema/migrations, schema/annex and the manifest emitters
type = no_foreign_tables
paths =
    packages
    scripts
    tools
    bench
    schema
allowed_paths =
    schema/migrations
    schema/annex
    packages/adopt-schema/src/adopt_schema/emitters

; --------------------------------------------------------------------------
; 10. no-revision-update (custom) -- the append-only guarantee
; --------------------------------------------------------------------------
[importlinter:contract:no-revision-update]
name = no-revision-update -- no UPDATE targets a *_revision table
type = no_revision_update
paths =
    packages
    scripts
    tools
    bench
    schema
allowed_paths =
    tests/fixtures/planted

; --------------------------------------------------------------------------
; 11. no-covered-cache-write (custom) -- only adopt_coverage writes the cache
; --------------------------------------------------------------------------
[importlinter:contract:no-covered-cache-write]
name = no-covered-cache-write -- only adopt_coverage writes covered_cache
type = no_covered_cache_write
paths =
    packages
    scripts
    tools
    bench
    schema
allowed_paths =
    packages/adopt-coverage
    schema/migrations
    tests/fixtures/planted

; --------------------------------------------------------------------------
; 12. workflow-body-purity (custom) -- a replayed body is deterministic
; --------------------------------------------------------------------------
[importlinter:contract:workflow-body-purity]
name = workflow-body-purity -- no clock, randomness, network, model call or I/O in a @workflow body
type = workflow_body_purity
paths =
    packages
    scripts
    tools
    bench
