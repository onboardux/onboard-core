; Import contracts -- implementation spec §5.1, all twelve.
;
; These are load-bearing, not stylistic. Eight are import-graph rules and are
; declared natively below. Four are statements about source text rather than
; about imports, and are implemented as custom contract types under
; `tools/contracts/` so that all twelve live in one file and run under one
; command. A rule enforced by a second tool is a rule that eventually runs in a
; job nobody watches.
;
; Every contract is live from S0 -- before the code it constrains exists. A gate
; switched on after the fact starts life with exemptions.

[importlinter]
root_packages =
    adopt_const
    adopt_obs
    adopt_schema
    adopt_model
    adopt_scope
    adopt_identity
    adopt_store
    adopt_coverage
    adopt_freshness
    adopt_export
    adopt_detect
    adopt_policy
    adopt_agent
    adopt_workflow
    adopt_map
    adopt_knowledge
    adopt_cli
include_external_packages = True
contract_types =
    no_foreign_tables: tools.contracts.NoForeignTablesContract
    no_revision_update: tools.contracts.NoRevisionUpdateContract
    no_covered_cache_write: tools.contracts.NoCoveredCacheWriteContract
    workflow_body_purity: tools.contracts.WorkflowBodyPurityContract

; --------------------------------------------------------------------------
; 1. no-raw-sqlite
; --------------------------------------------------------------------------
[importlinter:contract:no-raw-sqlite]
name = no-raw-sqlite -- only adopt_store.sqlite imports sqlite3
type = forbidden
source_modules =
    adopt_const
    adopt_obs
    adopt_schema
    adopt_model
    adopt_scope
    adopt_identity
    adopt_coverage
    adopt_freshness
    adopt_export
    adopt_detect
    adopt_policy
    adopt_agent
    adopt_workflow
    adopt_map
    adopt_knowledge
    adopt_cli
    adopt_store.facades
    adopt_store.vector
forbidden_modules =
    sqlite3
; The contract follows INDIRECT chains, which is what catches `adopt_store.facades`
; or `adopt_coverage` reaching the driver through a helper -- the check those
; packages' dialect-freedom actually rests on. Applied to `adopt_cli` unchanged it
; says something stronger than implementation spec §5.1 does ("only
; `adopt_store.sqlite` imports sqlite3"): it forbids the CLI from depending on
; `adopt_store` at all, and the CLI is the composition root -- `adopt store
; doctor` and `adopt init` (`02` §14, `05` S6) exist precisely to open a store.
;
; So the wiring module, and only the wiring module, is exempted by name. It holds
; no SQL and no dialect knowledge; it resolves a path and calls `open_store`.
; Every other `adopt_cli` module stays fully constrained, including indirectly --
; a command reaching for the driver itself still breaks this contract.
;
; The annex edge is the same exemption for the second store, not a widening of it
; (CR-47). Contracts §12's runtime annex is a store -- `.adopt/runtime.db` -- and
; `adopt detect`'s disambiguation pass needs one to answer an idempotency lookup
; before it spends anything. It arrives through this module for exactly the reason
; the other two do, and the narrowness is unchanged and still checked: a *command*
; module reaching `adopt_store.annex` directly still breaks this contract, which is
; watched failing rather than asserted.
ignore_imports =
    adopt_cli.store_option -> adopt_store
    adopt_cli.store_option -> adopt_store.api
    adopt_cli.store_option -> adopt_store.annex

; --------------------------------------------------------------------------
; 2. no-provider-sdk -- only adopt_agent.adapters imports a provider client
; --------------------------------------------------------------------------
[importlinter:contract:no-provider-sdk]
name = no-provider-sdk -- provider SDKs live only in adopt_agent.adapters
type = forbidden
source_modules =
    adopt_const
    adopt_obs
    adopt_schema
    adopt_model
    adopt_scope
    adopt_identity
    adopt_store
    adopt_coverage
    adopt_freshness
    adopt_export
    adopt_detect
    adopt_policy
    adopt_workflow
    adopt_map
    adopt_cli
forbidden_modules =
    anthropic
    openai
    litellm
    cohere
    mistralai
    vertexai
; Google's SDK ships as the namespace subpackage `google.generativeai`, and
; import-linter cannot express a subpackage of an external package as a
; forbidden module. It is covered instead by the licence gate: no provider SDK
; can enter the tree without a `licence-verifications.md` row, and adding one
; is the moment its top-level module is added to this list.

