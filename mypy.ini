[mypy]
python_version = 3.12
strict = True

# Strict is the baseline; these are the additions strict does not switch on.
warn_unreachable = True
disallow_any_unimported = True
disallow_any_decorated = True
implicit_reexport = False
strict_equality = True
extra_checks = True

show_error_codes = True
pretty = True
namespace_packages = True
explicit_package_bases = True

mypy_path =
    packages/adopt-const/src,
    packages/adopt-obs/src,
    packages/adopt-schema/src,
    packages/adopt-model/src,
    packages/adopt-scope/src,
    packages/adopt-identity/src,
    packages/adopt-store/src,
    packages/adopt-coverage/src,
    packages/adopt-freshness/src,
    packages/adopt-export/src,
    packages/adopt-detect/src,
    packages/adopt-policy/src,
    packages/adopt-agent/src,
    packages/adopt-workflow/src,
    packages/adopt-cli/src

[mypy-tests.*]
# Tests plant deliberately malformed values to prove the gates reject them.
disallow_any_decorated = False

[mypy-pytest_benchmark.*]
ignore_missing_imports = True
