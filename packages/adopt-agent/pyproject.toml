[project]
name = "adopt-agent"
version = "0.3.1"
description = "The single model seam: budget, tracing, idempotency, adapters. Implemented in S7."
requires-python = ">=3.12"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "The Adopt Authors" }]
# `no-provider-sdk` import contract: only `adopt_agent.adapters.*` may import a
# provider client. No model identifier is hard-coded anywhere, including as a
# default -- model selection is configuration.
#
# `no-raw-sqlite` names this package a source module and follows indirect
# chains, so there is deliberately **no `adopt-store` here**: the runtime annex
# is reached through the `AnnexRecords` port and realized in `adopt_store.annex`
# (contracts §12, CR-34's pattern).
dependencies = [
    "adopt-const",
    "adopt-obs",
    "pydantic>=2.7,<3",
    "pyyaml>=6,<7",
]

[project.urls]
Homepage = "https://github.com/onboardux/onboard-core"
Source = "https://github.com/onboardux/onboard-core"
Issues = "https://github.com/onboardux/onboard-core/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/adopt_agent"]

# Apache-2.0 4(a) and 4(d): the licence and the NOTICE travel with every
# redistribution. `uv build` builds the wheel from the sdist, so placing the
# repository root's single authored copy here puts it in both artefacts and
# leaves nothing to drift.
[tool.hatch.build.targets.sdist.force-include]
"../../LICENSE" = "LICENSE"
"../../NOTICE" = "NOTICE"
