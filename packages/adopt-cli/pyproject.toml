[project]
name = "adopt-cli"
version = "0.3.1"
description = "The adopt command surface: config resolution, JSON mode, exit codes."
requires-python = ">=3.12"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "The Adopt Authors" }]
# `adopt-agent` is here for `adopt agent adapters | check` (contracts §14). It
# drags no driver in: the seam reaches the runtime annex through the
# `AnnexRecords` port, so `no-raw-sqlite` -- which follows indirect chains into
# `adopt_cli` (CR-36) -- sees nothing new.
dependencies = [
    "adopt-agent",
    "adopt-const",
    "adopt-coverage",
    "adopt-detect",
    "adopt-export",
    "adopt-freshness",
    "adopt-identity",
    # Build 1: `adopt map` composes `adopt_map`'s scope resolver and writer, and
    # runs `common.stub` until S1.3's plugin framework lands. Declared rather
    # than left to arrive transitively -- the defect the `adopt-model` note below
    # records is the same one, one sprint earlier.
    "adopt-map",
    "adopt-extractors-common",
    # The five archetype packs, declared for the same reason `adopt-model` below
    # is: `commands/map_command.py` imports every one of them by name to build
    # the registry, and they arrived only because a workspace sync installs the
    # whole workspace. `pip install adopt-cli` alone raised ModuleNotFoundError
    # on the first `adopt map` -- a working binary that fails at the verb it was
    # built for. S1.1 declared the two packs that existed then and S1.4-S1.6
    # added five imports without touching this list, which is the defect the
    # note below records arriving a third time.
    "adopt-extractors-ai",
    "adopt-extractors-data",
    "adopt-extractors-lowcode",
    "adopt-extractors-platform",
    "adopt-extractors-web",
    # `adopt_model._enums` is imported directly by `commands/init.py` and
    # `commands/boundary.py`. It arrived transitively through `adopt-store` until
    # someone installed a subset that did not include it, which is why an
    # undeclared dependency is a defect even while it happens to resolve.
    "adopt-model",
    "adopt-obs",
    "adopt-policy",
    "adopt-scope",
    "adopt-store",
    "typer>=0.12,<1",
    "rich>=13,<15",
    "click>=8,<9",
    "pyyaml>=6,<7",
]

[project.scripts]
adopt = "adopt_cli.main:main"

[project.urls]
Homepage = "https://github.com/onboardux/onboard-core"
Source = "https://github.com/onboardux/onboard-core"
Issues = "https://github.com/onboardux/onboard-core/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/adopt_cli"]

# Apache-2.0 4(a) and 4(d): the licence and the NOTICE travel with every
# redistribution. `uv build` builds the wheel from the sdist, so placing the
# repository root's single authored copy here puts it in both artefacts and
# leaves nothing to drift.
[tool.hatch.build.targets.sdist.force-include]
"../../LICENSE" = "LICENSE"
"../../NOTICE" = "NOTICE"
