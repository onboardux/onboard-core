[project]
name = "adopt-const"
version = "0.3.0.dev0"
description = "Every tunable for adopt-core, and nothing else."
requires-python = ">=3.12"
# `const-leaf` import contract: this package imports nothing. Adding a
# dependency here is a lint failure, not a review comment.
dependencies = []

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/adopt_const"]
