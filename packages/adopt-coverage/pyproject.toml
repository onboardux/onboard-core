[project]
name = "adopt-coverage"
version = "0.3.0"
description = "recompute_coverage and the cache-disagreement alarm. Implemented in S4."
requires-python = ">=3.12"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "The Adopt Authors" }]
# `no-covered-cache-write` contract: this is the ONLY package permitted to write
# `covered_cache` or `covered_cache_at`.
#
# `adopt-store` is deliberately **absent**. This package declares its own storage
# ports and is handed a realization that satisfies them structurally, exactly as
# `adopt-scope` is. Depending on `adopt-store` would drag `sqlite3` into the
# import graph and break `no-raw-sqlite`, which names `adopt_coverage` as a
# source module.
dependencies = [
    "adopt-const",
    "adopt-model",
    "adopt-obs",
]

[project.urls]
Homepage = "https://github.com/onboardux/onboard-core"
Source = "https://github.com/onboardux/onboard-core"
Issues = "https://github.com/onboardux/onboard-core/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/adopt_coverage"]

# Apache-2.0 4(a) and 4(d): the licence and the NOTICE travel with every
# redistribution. `uv build` builds the wheel from the sdist, so placing the
# repository root's single authored copy here puts it in both artefacts and
# leaves nothing to drift.
[tool.hatch.build.targets.sdist.force-include]
"../../LICENSE" = "LICENSE"
"../../NOTICE" = "NOTICE"
