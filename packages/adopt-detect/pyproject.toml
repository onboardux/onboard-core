[project]
name = "adopt-detect"
version = "0.3.0"
description = "Archetype detection, tier negotiation, the observability boundary. Implemented in S6."
requires-python = ">=3.12"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "The Adopt Authors" }]
# `adopt-store` is deliberately **absent**. This package declares its own storage
# port (`records.BoundaryRecords`) and is handed a realization that satisfies it
# structurally, exactly as `adopt-scope`, `adopt-coverage`, `adopt-freshness` and
# `adopt-export` are (CR-34, CR-37). Depending on `adopt-store` would drag
# `sqlite3` into the import graph and break `no-raw-sqlite`, which names
# `adopt_detect` as a source module.
#
# `pyyaml` is here because the archetype rules are **data**: implementation spec
# §4.11 requires that adding a signal be a data change, and a rule set expressed
# as Python would make every new signal a review of a scoring function.
#
# `adopt-agent` is here for the `04` §4 disambiguation pass (`disambiguate.py`),
# Build 0's one production model caller. The pass takes an `AgentRunner` -- `02`
# §10.1's Protocol -- rather than constructing one, so `detect()` still cannot
# reach a model. `no-provider-sdk` is unaffected: the adapters are resolved by a
# lazy `import_module` inside `adopt_agent.adapters`, and under CR-46 no vendor
# SDK is in the tree at all.
dependencies = [
    "adopt-agent",
    "adopt-const",
    "adopt-model",
    "adopt-obs",
    "adopt-scope",
    "pyyaml>=6,<7",
]

[project.urls]
Homepage = "https://github.com/onboardux/onboard-core"
Source = "https://github.com/onboardux/onboard-core"
Issues = "https://github.com/onboardux/onboard-core/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/adopt_detect"]

# Apache-2.0 4(a) and 4(d): the licence and the NOTICE travel with every
# redistribution. `uv build` builds the wheel from the sdist, so placing the
# repository root's single authored copy here puts it in both artefacts and
# leaves nothing to drift.
[tool.hatch.build.targets.sdist.force-include]
"../../LICENSE" = "LICENSE"
"../../NOTICE" = "NOTICE"
