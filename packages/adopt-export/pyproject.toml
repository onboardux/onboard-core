[project]
name = "adopt-export"
version = "0.3.0"
description = "Export bundle writer and reader; the byte-stable round trip."
requires-python = ">=3.12"
# `adopt-store` is deliberately **absent**, exactly as it is for `adopt-coverage`
# and `adopt-freshness`. This package declares its own storage ports and is
# handed a realization that satisfies them structurally; depending on
# `adopt-store` would drag `sqlite3` into the import graph and break
# `no-raw-sqlite`, which names `adopt_export` as a source module.
#
# `adopt-schema` **is** present: the manifest is what says which tables are
# exportable, in what foreign-key order, and what each one's primary key is.
# Re-deriving any of that here would be a second schema authority.
dependencies = [
    "adopt-const",
    "adopt-model",
    "adopt-obs",
    "adopt-schema",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/adopt_export"]
