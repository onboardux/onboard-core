[project]
name = "adopt-extractors-ai"
version = "0.3.0"
description = "AI-deployment extractors -- prompts, model pins, tool schemas, retrieval config, graph nodes, eval sets. Build 1 S1.5."
requires-python = ">=3.12"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "The Adopt Authors" }]
# An extractor emits `SurfaceFact`s and never writes, so this package depends on
# `adopt-map` for the shapes and on nothing that can reach a store (`02` §7
# obligation 2).
#
# **No new third-party distribution.** `05` S1.5 reads prompts, pins, tools,
# retrieval configuration, graph nodes and eval sets out of Python and
# TypeScript source, YAML, JSON and TOML -- all of which the grammar rung and
# `pyyaml` already cover. It imports no LangGraph, no provider SDK and no model
# client: `02` §7 obligation 1, and the same argument the web pack makes about
# Django. `docs/pack/OPEN-DECISIONS.md` OD-12 is therefore untouched by this
# sprint -- it declines libraries this pack never needed.
dependencies = [
    "adopt-const",
    "adopt-map",
    "adopt-model",
    "tree-sitter>=0.25,<0.27",
    "tree-sitter-language-pack>=1.14,<2",
    # Retrieval configuration and eval sets arrive as YAML as often as JSON.
    # Not a new dependency: `pyyaml` already carries a seven-field
    # `licence-verifications.md` row (MIT, `in-binary`).
    "pyyaml>=6,<7",
]

[project.urls]
Homepage = "https://github.com/onboardux/onboard-core"
Source = "https://github.com/onboardux/onboard-core"
Issues = "https://github.com/onboardux/onboard-core/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/adopt_extractors_ai"]

# Apache-2.0 4(a) and 4(d): the licence and the NOTICE travel with every
# redistribution.
[tool.hatch.build.targets.sdist.force-include]
"../../LICENSE" = "LICENSE"
"../../NOTICE" = "NOTICE"
