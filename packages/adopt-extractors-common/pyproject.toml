[project]
name = "adopt-extractors-common"
version = "0.3.0"
description = "Extractors shared across every archetype. S1.1 ships `common.stub`; S1.3 fills the pack."
requires-python = ">=3.12"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "The Adopt Authors" }]
# An extractor emits `SurfaceFact`s and never writes, so this package depends on
# `adopt-map` for the shapes and on nothing that can reach a store (`02` §7
# obligation 2).
dependencies = [
    "adopt-const",
    "adopt-map",
    "adopt-model",
]

[project.urls]
Homepage = "https://github.com/onboardux/onboard-core"
Source = "https://github.com/onboardux/onboard-core"
Issues = "https://github.com/onboardux/onboard-core/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/adopt_extractors_common"]

[tool.hatch.build.targets.sdist.force-include]
"../../LICENSE" = "LICENSE"
"../../NOTICE" = "NOTICE"
