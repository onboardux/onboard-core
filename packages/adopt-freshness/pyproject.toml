[project]
name = "adopt-freshness"
version = "0.3.1"
description = "resolve_freshness: multi-level, load-bearing propagation, sensor override. Implemented in S4."
requires-python = ">=3.12"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "The Adopt Authors" }]
# `adopt-const` for `SENSOR_MISSED_CADENCE_MULTIPLIER`, which is the one number
# this package uses and which lives in exactly one place.
#
# `adopt-store` is deliberately **absent**, for the reason given in
# `adopt-coverage/pyproject.toml`: this package declares its own storage port and
# is handed a realization that satisfies it structurally, so no chain reaches
# `sqlite3`.
dependencies = [
    "adopt-const",
    "adopt-model",
    "adopt-obs",
]

[project.urls]
Homepage = "https://github.com/onboardux/onboard-core"
Source = "https://github.com/onboardux/onboard-core"
Issues = "https://github.com/onboardux/onboard-core/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/adopt_freshness"]

# Apache-2.0 4(a) and 4(d): the licence and the NOTICE travel with every
# redistribution. `uv build` builds the wheel from the sdist, so placing the
# repository root's single authored copy here puts it in both artefacts and
# leaves nothing to drift.
[tool.hatch.build.targets.sdist.force-include]
"../../LICENSE" = "LICENSE"
"../../NOTICE" = "NOTICE"
