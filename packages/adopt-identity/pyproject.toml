[project]
name = "adopt-identity"
version = "0.3.0"
description = "The identity URI: build, parse, validate."
requires-python = ">=3.12"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "The Adopt Authors" }]
# `adopt-scope` is a dependency because a URI is built from resolved scope
# slugs (CR-05), and `adopt-model` because `identity_kind` is a declared
# vocabulary rather than free text. Neither is storage: this package opens no
# file, no socket and no database.
dependencies = [
    "adopt-const",
    "adopt-model",
    "adopt-obs",
    "adopt-scope",
]

[project.urls]
Homepage = "https://github.com/onboardux/adopt-core"
Source = "https://github.com/onboardux/adopt-core"
Issues = "https://github.com/onboardux/adopt-core/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/adopt_identity"]

# Apache-2.0 4(a) and 4(d): the licence and the NOTICE travel with every
# redistribution. `uv build` builds the wheel from the sdist, so placing the
# repository root's single authored copy here puts it in both artefacts and
# leaves nothing to drift.
[tool.hatch.build.targets.sdist.force-include]
"../../LICENSE" = "LICENSE"
"../../NOTICE" = "NOTICE"
