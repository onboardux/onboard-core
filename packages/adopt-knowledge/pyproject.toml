[project]
name = "adopt-knowledge"
version = "0.3.1"
description = "adopt ingest/bind/review: knowledge items bound honestly to identities. Build 2."
requires-python = ">=3.12"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "The Adopt Authors" }]
# One distribution for the whole knowledge loop -- ingest, the binding matchers
# and the review queue -- on Build 1's precedent: the pieces are modules, not
# wheels, because a matcher that can be installed without the queue that
# confirms its suggestions is a matcher whose suggestions become bindings
# nobody ever saw.
#
# `adopt-store` is deliberately **absent**, exactly as for `adopt-map`,
# `adopt-detect`, `adopt-export` and `adopt-coverage` (CR-34, CR-37). This
# package declares the narrow writer/reader protocols it needs and is handed
# realizations structurally by the CLI, which is the composition root.
# Depending on `adopt-store` would drag `sqlite3` into the import graph and
# break `no-raw-sqlite`, which names `adopt_knowledge` as a source module.
#
# `pyyaml` is here for document frontmatter, which is the only YAML ingest
# reads. No parser beyond the standard library and this one.
dependencies = [
    "adopt-const",
    "adopt-identity",
    "adopt-model",
    "adopt-obs",
    "adopt-scope",
    "pyyaml>=6,<7",
]

[project.urls]
Homepage = "https://github.com/onboardux/onboard-core"
Source = "https://github.com/onboardux/onboard-core"
Issues = "https://github.com/onboardux/onboard-core/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/adopt_knowledge"]

# Apache-2.0 4(a) and 4(d): the licence and the NOTICE travel with every
# redistribution. `uv build` builds the wheel from the sdist, so placing the
# repository root's single authored copy here puts it in both artefacts and
# leaves nothing to drift.
[tool.hatch.build.targets.sdist.force-include]
"../../LICENSE" = "LICENSE"
"../../NOTICE" = "NOTICE"
