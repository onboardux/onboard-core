[project]
name = "adopt-map"
version = "0.3.1"
description = "adopt map: deterministic identity extraction from a repository. Build 1."
requires-python = ">=3.12"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "The Adopt Authors" }]
# One distribution, packs as **modules** (v6.1 §6). Seven wheels was the v4-line
# shape and it let a pack drift from the runner that schedules it; worse, the CLI
# imported six packs while declaring one, so `pip install adopt-cli` produced a
# `ModuleNotFoundError` on the flagship command (B-10). Modules make that
# unrepresentable.
#
# `adopt-store` is deliberately **absent**, exactly as it is for `adopt-detect`,
# `adopt-export` and `adopt-coverage` (CR-34, CR-37). This package declares the
# narrow `IdentityWriter` protocol it needs and is handed a realization
# structurally by the CLI, which is the composition root. Depending on
# `adopt-store` would drag `sqlite3` into the import graph and break
# `no-raw-sqlite`, which names `adopt_map` as a source module.
#
# `pyyaml` is here for CI workflow manifests, which are the only YAML the generic
# pack reads. No parser beyond the standard library and this one: v6.1 §6 makes
# parsing "manifest/regex-first", with tree-sitter reserved for a pack that
# demonstrably needs it and cannot enter without a licence row.
dependencies = [
    "adopt-const",
    "adopt-detect",
    "adopt-identity",
    "adopt-model",
    "adopt-obs",
    "adopt-scope",
    "pyyaml>=6,<7",
]

[project.urls]
Homepage = "https://github.com/onboardux/onboard-core"
Source = "https://github.com/onboardux/onboard-core"
Issues = "https://github.com/onboardux/onboard-core/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/adopt_map"]

# Apache-2.0 4(a) and 4(d): the licence and the NOTICE travel with every
# redistribution. `uv build` builds the wheel from the sdist, so placing the
# repository root's single authored copy here puts it in both artefacts and
# leaves nothing to drift.
[tool.hatch.build.targets.sdist.force-include]
"../../LICENSE" = "LICENSE"
"../../NOTICE" = "NOTICE"
