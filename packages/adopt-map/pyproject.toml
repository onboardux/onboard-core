[project]
name = "adopt-map"
version = "0.3.0"
description = "`adopt map` -- the system surface map. Build 1: scope resolution, URI minting, the revision-aware writer."
requires-python = ">=3.12"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "The Adopt Authors" }]
# `adopt-store` is deliberately **absent**, exactly as it is from `adopt-coverage`
# and `adopt-export`. This package declares its own storage ports and is handed a
# realization that satisfies them structurally (`docs/pack/OPEN-DECISIONS.md`
# OD-1/OD-2). Depending on `adopt-store` would drag `sqlite3` into the import
# graph and break `no-raw-sqlite`, which names `adopt_map` as a source module.
dependencies = [
    "adopt-const",
    # S1.3: `recompute_coverage` is the coverage authority and `rebuild_cache`
    # is the **only** sanctioned writer of `covered_cache` -- `no-covered-cache-write`
    # admits `packages/adopt-coverage` and nothing else, so `adopt_map.coverage`
    # supplies the authority and the handle and owns neither half of the statement.
    # `adopt-coverage` reaches no dialect, so this does not breach `no-raw-sqlite`.
    "adopt-coverage",
    "adopt-identity",
    "adopt-model",
    "adopt-obs",
    "adopt-scope",
    "pydantic>=2.8,<3",
    # The `02` §5 front-matter block. Not a new third-party dependency: `pyyaml`
    # already carries a `licence-verifications.md` row (MIT, `in-binary`) and is
    # a runtime dependency of six Build 0 packages. Declared here rather than
    # inherited transitively, which is what `adopt-store`'s own S1.1 finding was
    # about.
    "pyyaml>=6,<7",
]

[project.urls]
Homepage = "https://github.com/onboardux/onboard-core"
Source = "https://github.com/onboardux/onboard-core"
Issues = "https://github.com/onboardux/onboard-core/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/adopt_map"]

# Apache-2.0 4(a) and 4(d): the licence and the NOTICE travel with every
# redistribution.
[tool.hatch.build.targets.sdist.force-include]
"../../LICENSE" = "LICENSE"
"../../NOTICE" = "NOTICE"
