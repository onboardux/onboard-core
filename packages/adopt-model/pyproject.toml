[project]
name = "adopt-model"
version = "0.3.0.dev0"
description = "GENERATED typed models, one per table, enum and wire shape. Never hand-edited."
requires-python = ">=3.12"
# `generated-purity` import contract: this package may import only `pydantic`
# and `adopt_const`. Nothing else, ever.
dependencies = ["pydantic>=2,<3"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/adopt_model"]
