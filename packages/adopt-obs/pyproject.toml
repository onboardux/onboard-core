[project]
name = "adopt-obs"
version = "0.3.0.dev0"
description = "Structured logging, typed errors, id generation, redaction, the injectable clock."
requires-python = ">=3.12"
dependencies = ["adopt-const"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/adopt_obs"]
