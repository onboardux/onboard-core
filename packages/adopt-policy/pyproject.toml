[project]
name = "adopt-policy"
version = "0.3.0"
description = "Capability-manifest validation, outbound-envelope validation, the signature interface. Implemented in S6."
requires-python = ">=3.12"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "The Adopt Authors" }]
# `adopt-schema` is here for the reason implementation spec §4.10 already gives
# for `adopt-export`: the manifest is what says which tables are exportable and
# what each column's type is, and contracts §8 rule 2 defines half the envelope
# content deny-list in exactly those terms. Re-deriving it here would be a second
# schema authority -- and a hand-kept list of content columns is one that falls
# behind the first `md` column somebody adds.
#
# `adopt-detect` is here because `BoundaryView` has one home (contracts §8). A
# second declaration of the boundary's shape would be a second answer to "what
# may leave", which is the question this package exists to answer once.
dependencies = [
    "adopt-const",
    "adopt-detect",
    "adopt-model",
    "adopt-obs",
    "adopt-schema",
    "pyyaml>=6,<7",
]

[project.urls]
Homepage = "https://github.com/onboardux/onboard-core"
Source = "https://github.com/onboardux/onboard-core"
Issues = "https://github.com/onboardux/onboard-core/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/adopt_policy"]

# Apache-2.0 4(a) and 4(d): the licence and the NOTICE travel with every
# redistribution. `uv build` builds the wheel from the sdist, so placing the
# repository root's single authored copy here puts it in both artefacts and
# leaves nothing to drift.
[tool.hatch.build.targets.sdist.force-include]
"../../LICENSE" = "LICENSE"
"../../NOTICE" = "NOTICE"
