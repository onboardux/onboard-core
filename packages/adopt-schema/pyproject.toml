[project]
name = "adopt-schema"
version = "0.3.1"
description = "Manifest loader, four emitters, the additive-only linter, and migrations."
requires-python = ">=3.12"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "The Adopt Authors" }]
# `sqlite3` is deliberately absent: the `no-raw-sqlite` import contract names
# this package as a source module, so `migrate.apply` drives an injected
# `MigrationTarget` rather than opening a connection of its own.
dependencies = [
    "adopt-const",
    "adopt-obs",
    "pydantic>=2,<3",
    "pyyaml>=6,<7",
    "typer>=0.12,<1",
]

[project.scripts]
adopt-schema = "adopt_schema.cli:main"

[project.urls]
Homepage = "https://github.com/onboardux/onboard-core"
Source = "https://github.com/onboardux/onboard-core"
Issues = "https://github.com/onboardux/onboard-core/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/adopt_schema"]

# `schema/` travels inside the wheel. Readers resolve it through
# `adopt_schema.assets`; see `hatch_build.py` for why the wheel half is a hook
# and the sdist half is static. The authored copy stays at the repository root.
[tool.hatch.build.targets.wheel.hooks.custom]
path = "hatch_build.py"

[tool.hatch.build.targets.sdist.force-include]
"../../LICENSE" = "LICENSE"
"../../NOTICE" = "NOTICE"
"../../schema" = "src/adopt_schema/_assets/schema"
