[project]
name = "adopt-store"
version = "0.3.1"
description = "SQLite realization, facades, transactions, the VectorIndex seam."
requires-python = ">=3.12"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "The Adopt Authors" }]
# `no-raw-sqlite` import contract: only `adopt_store.sqlite` may import sqlite3.
# `no-vector-impl`: only `adopt_store.vector` may import a vector driver.
#
# `adopt-coverage` is a dependency of `doctor` alone, and the edge runs one way:
# `adopt_coverage` imports nothing from here, which is what keeps it clear of
# `sqlite3` and keeps the two packages acyclic.
#
# `adopt-agent` is the same shape and for the same reason: it declares the
# runtime-annex port (contracts §12, CR-08) and `adopt_store.annex` realizes it,
# because `no-raw-sqlite` forbids the seam from reaching a driver even
# indirectly. The edge runs one way -- `adopt_agent` imports nothing from here.
#
# `adopt-ask` is the third of that shape (v6.1 §6 Build 3, F1): it declares the
# `SearchRecords` port and `adopt_store.annex.search` realizes it on FTS5, for
# the identical reason -- `adopt_ask` is named in `no-raw-sqlite` and may not
# reach a driver, indirectly or otherwise. The edge runs one way; `adopt_ask`
# imports nothing from here.
dependencies = [
    "adopt-agent",
    "adopt-ask",
    "adopt-const",
    "adopt-coverage",
    # `adopt_store.facades.identity` imports `build_uri` and `parse_uri`. This
    # was undeclared and invisible: every test runs against `uv sync
    # --all-packages`, where all fifteen distributions are present whatever any
    # one of them declares, and the `packaged-artifact` gate installs
    # `adopt-cli`, which declares `adopt-identity` itself. The gap only appears
    # to a consumer installing a *subset* -- `adopt-plane` was the first.
    "adopt-identity",
    "adopt-model",
    "adopt-obs",
    "adopt-schema",
    "adopt-scope",
    "pydantic>=2.7,<3",
]

[project.urls]
Homepage = "https://github.com/onboardux/onboard-core"
Source = "https://github.com/onboardux/onboard-core"
Issues = "https://github.com/onboardux/onboard-core/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/adopt_store"]

# Apache-2.0 4(a) and 4(d): the licence and the NOTICE travel with every
# redistribution. `uv build` builds the wheel from the sdist, so placing the
# repository root's single authored copy here puts it in both artefacts and
# leaves nothing to drift.
[tool.hatch.build.targets.sdist.force-include]
"../../LICENSE" = "LICENSE"
"../../NOTICE" = "NOTICE"
