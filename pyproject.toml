# `adopt-core` — uv workspace root (virtual; carries no package of its own).
#
# Repository layout, locked tooling and package responsibilities are governed by
# `03-implementation-spec-build0.md` §1. Do not add a dependency here without
# running `scripts/licence_gate.py` first and adding its row to
# `licence-verifications.md` -- the gate fails on a dependency with no record.

# **The toolchain is pinned like every other input, and this is the single
# source for it.** `astral-sh/setup-uv` reads `[tool.uv] required-version`
# from this file, so a workflow needs to name no version of its own.
#
# **The version is 0.9.5 because that is what builds the release.** Until
# 2026-09-20 `release.yml` pinned `0.9.5` on all three of its jobs and nothing
# else pinned anything -- so `ci.yml`, `bench.yml` and `licence-audit.yml`
# resolved `latest`, which was 0.12.17 by then. The wheels that are signed and
# attested were therefore built by one resolver and proven green by another,
# three minor versions apart. CI now agrees with the release path rather than
# the release path being dragged to whatever shipped that morning (N44).
#
# An **exact** specifier is load bearing twice over: setup-uv's
# `ExactVersionResolver` returns without contacting the network, where a range
# or `latest` fetches the version manifest from `raw.githubusercontent.com` on
# the critical path of every job -- the fetch that took `scope-escape`, a
# release blocker forever, red on the plane on 2026-09-13 forty-two seconds in,
# before any test ran. And `uv` itself refuses to run when the binary on PATH
# is a different version, so a developer machine cannot silently disagree.
#
# Bumping it is a deliberate PR: change this line, let CI prove the new version
# green, and keep `uv.lock` and `release.yml`'s literals in the same change.
[tool.uv]
required-version = "==0.9.5"

[tool.uv.workspace]
members = ["packages/*"]

[tool.uv.sources]
adopt-const = { workspace = true }
adopt-obs = { workspace = true }
adopt-schema = { workspace = true }
adopt-model = { workspace = true }
adopt-scope = { workspace = true }
adopt-identity = { workspace = true }
adopt-store = { workspace = true }
adopt-coverage = { workspace = true }
adopt-freshness = { workspace = true }
adopt-export = { workspace = true }
adopt-detect = { workspace = true }
adopt-policy = { workspace = true }
adopt-agent = { workspace = true }
adopt-workflow = { workspace = true }
adopt-knowledge = { workspace = true }
adopt-map = { workspace = true }
adopt-ask = { workspace = true }
adopt-handover = { workspace = true }
adopt-probe = { workspace = true }
adopt-cli = { workspace = true }

[dependency-groups]
dev = [
    "ruff>=0.6,<1",
    "mypy>=1.11,<2",
    "import-linter>=2.0,<3",
    "pytest>=9.0.3,<10",
    "pytest-benchmark>=4,<6",
    "hypothesis>=6.100,<7",
    # Stubs, not a runtime dependency: `mypy --strict` with
    # `disallow_any_unimported` rejects an untyped import outright, and
    # silencing it with an ignore would hide every future type error in the
    # manifest loader's YAML boundary.
    "types-PyYAML>=6,<7",
    "coverage>=7.6,<8",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Sleeps in tests are banned (impl spec §5) -- use the injectable clock.
addopts = "-q --strict-markers --strict-config"
markers = [
    "unit: fast, deterministic, no external dependency",
    "property: hypothesis-driven invariant test",
    "e2e: one of the nine critical user journeys",
    "golden: the G0 fixture round-trip suite",
    "conformance: adapter conformance suite",
    "durability: workflow kill-and-resume drill",
    "bench: performance harness for an NFR gate constant",
]
filterwarnings = ["error"]
