# Ruff configuration -- `adopt-core`.
#
# Lint is not stylistic here: the rules selected below are the ones that carry a
# runtime invariant (no bare except, no mutable default, no shadowed builtin in a
# public signature). Formatting is delegated wholesale to `ruff format`.

target-version = "py312"
line-length = 100
src = ["packages", "scripts", "tools", "tests", "bench"]

# The S6 detection corpus is **not our code**. Each tree is a synthetic stand-in
# for a client system, and every file in it exists to carry a framework signal --
# `from django.db import models` in an otherwise empty module is not an unused
# import, it is the evidence detection reads. Linting them would mean either
# ignoring a growing wall of warnings or "fixing" the fixtures until they no
# longer resemble the systems they stand for, and the second is how a corpus
# stops testing anything.
exclude = ["tests/fixtures/repos"]

[lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "B",    # flake8-bugbear
    "C4",   # flake8-comprehensions
    "UP",   # pyupgrade
    "S",    # flake8-bandit
    "T20",  # flake8-print -- stdout is the CLI's, not a library's
    "RET",  # flake8-return
    "SIM",  # flake8-simplify
    "PTH",  # flake8-use-pathlib
    "RUF",  # ruff-specific
]
ignore = [
    "E501",  # line length is enforced by the formatter
]

[lint.per-file-ignores]
# Tests may assert, use magic values, and plant deliberately unsafe fixtures.
"tests/**" = ["S101", "S105", "S106", "S108", "S603", "S607"]
# Gate scripts and the CLI are the two places that legitimately write to stdout.
"scripts/**" = ["T20", "S603", "S607"]
"tools/**" = ["T20"]
"packages/adopt-cli/**" = ["T20"]
# A benchmark harness reports to stdout and drives `psql` as a subprocess; it is
# a measurement tool, not library code, and is never linked into the wheel.
"bench/**" = ["T20", "S603", "S607"]
# The `detect-001` golden set is a **reporting script that happens to live under
# `tests/`**, because `05` S7 and `03` §1.2 place it there. AI spec §7.2 makes it
# informational rather than gating, so it prints a result table and exits 0 -- it
# is deliberately not a pytest test, since a skipped eval that renders as a
# passing test is the exact failure the whole file is written against.
# `BLE001`: one bad case must not end the report, so it catches broadly and
# records the reason per case.
"tests/golden_prompts/**" = ["T20", "BLE001"]

[lint.isort]
known-first-party = [
    "adopt_const", "adopt_obs", "adopt_schema", "adopt_model", "adopt_scope",
    "adopt_identity", "adopt_store", "adopt_coverage", "adopt_freshness",
    "adopt_export", "adopt_detect", "adopt_policy", "adopt_agent",
    "adopt_workflow", "adopt_cli",
    # `tests` is a namespace package rooted at the repository, and shared test
    # support is imported through it (`tests.golden.fixture`). Without this it
    # sorts as third-party, which puts the repository's own fixture builder in
    # the same block as `pytest`.
    "tests",
]

[format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"
