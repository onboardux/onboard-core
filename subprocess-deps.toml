# Copyleft dependencies invoked as subprocesses, never linked.
#
# The dependency licence policy is permissive-only in-binary. A copyleft tool
# may still be *used*, provided it is invoked across a process boundary and the
# invocation site is declared here. Declaring the site is what turns "we only
# shell out to it" from an intention into a fact `scripts/licence_gate.py` can
# check.
#
# Build 0 declares none. The entries the design anticipates -- universal-ctags,
# Semgrep CE, Pandoc and Quarto, all GPL or LGPL -- belong to later build items
# and are added in the change that first invokes them, together with the module
# and function that does the invoking.
#
# Format:
#
#   [[subprocess]]
#   name = "universal-ctags"
#   licence = "GPL-2.0-or-later"
#   invocation_site = "adopt_extract/ctags.py:run_ctags"
#   reason = "Symbol extraction for languages without a tree-sitter grammar."

# Build 4 (v6.1 §6) declares the first two. `adopt pack --format docx|pdf`
# converts the canonical Markdown with an external binary; neither is imported,
# neither is linked, and neither is bundled. Pandoc is the one the policy is
# actually about -- GPL-2.0-or-later, which `03` §7.3 forbids in-binary
# absolutely -- and typst is recorded on the same terms despite being permissive,
# because the declaration is about *how it is invoked* and a rule that only
# applied to copyleft tools would be a rule nobody applied to the next one.

[[subprocess]]
name = "pandoc"
licence = "GPL-2.0-or-later"
invocation_site = "adopt_handover/derived.py:convert"
reason = "Markdown -> DOCX for `adopt pack --format docx` (v6.1 §6 Build 4 demo line 4). Derived, content-equivalent output; never read back into the store."

[[subprocess]]
name = "typst"
licence = "Apache-2.0"
invocation_site = "adopt_handover/derived.py:convert"
reason = "Markdown -> PDF for `adopt pack --format pdf`. Same seam as pandoc; tool-optional and not installed in CI."
